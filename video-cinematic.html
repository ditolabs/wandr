<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wandr Cinematic Video Itinerary - Fullscreen Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------------
       EMIL KOWALSKI DESIGN PRINCIPLES:
       1. Composite-only animations (transform & opacity only).
       2. Strict spring easing: cubic-bezier(0.16, 1, 0.3, 1).
       3. Staggered choreography with micro-delays (40ms steps).
       4. GPU layer isolation via will-change & translate3d.
       5. 100% Fixed Edge-to-Edge Fullscreen (No mockup, no borders).
       ------------------------------------------------------------- */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; 
    }
    
    :root {
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
      --ease-in-quad: cubic-bezier(0.7, 0, 0.84, 0);
      --amber-accent: #f59e0b;
      --sky-accent: #38bdf8;
      --emerald-accent: #10b981;
      --orange-accent: #f97316;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #020617;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* 100% TRUE FULLSCREEN CONTAINER */
    .fullscreen-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #020617;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* Background Photo Layer with Hardware-Accelerated Ken Burns */
    .photo-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .bg-photo {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      background-size: cover;
      background-position: center;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0) scale(1.08);
      transition: opacity 0.6s var(--ease-spring), transform 5s linear;
      opacity: 0;
    }

    .bg-photo.active {
      opacity: 1;
      transform: translate3d(0, -15px, 0) scale(1.0);
    }

    /* Cinematic Gradient Vignette */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, 
        rgba(2, 6, 23, 0.8) 0%, 
        rgba(2, 6, 23, 0.15) 35%, 
        rgba(2, 6, 23, 0.6) 65%, 
        rgba(2, 6, 23, 0.98) 100%);
      z-index: 5;
      pointer-events: none;
    }

    /* Story Progress Bar */
    .story-progress-wrapper {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      left: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 30;
    }

    .story-bar-track {
      flex: 1;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .story-bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      background: #ffffff;
      border-radius: 4px;
      will-change: width;
    }

    /* Top Metadata Bar */
    .top-meta {
      position: absolute;
      top: max(30px, calc(env(safe-area-inset-top, 16px) + 16px));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }

    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald-accent);
      box-shadow: 0 0 10px var(--emerald-accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .audio-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.2s var(--ease-spring);
    }

    .audio-btn:active {
      transform: scale(0.9);
    }

    /* Fullscreen Touch Tap Zones */
    .tap-nav-zone {
      position: absolute;
      top: 60px;
      bottom: 240px;
      width: 50%;
      z-index: 20;
      cursor: pointer;
    }
    .tap-prev { left: 0; }
    .tap-next { right: 0; }

    /* Bottom Choreographed Content Card */
    .bottom-card-stage {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 16px;
      right: 16px;
      z-index: 25;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      will-change: transform, opacity;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Choreographed Text Items inside Card */
    .stagger-item {
      will-change: transform, opacity;
      transition: transform 0.45s var(--ease-spring), opacity 0.45s var(--ease-spring);
    }

    .entering .stagger-item {
      opacity: 0;
      transform: translate3d(0, 22px, 0);
    }

    .entered .stagger-item {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .stagger-item:nth-child(1) { transition-delay: 40ms; }
    .stagger-item:nth-child(2) { transition-delay: 80ms; }
    .stagger-item:nth-child(3) { transition-delay: 120ms; }
    .stagger-item:nth-child(4) { transition-delay: 160ms; }
    .stagger-item:nth-child(5) { transition-delay: 200ms; }

    .tag-bubble {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--amber-accent);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: clamp(0.8rem, 2.8vw, 0.95rem);
      color: var(--sky-accent);
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .hero-desc {
      font-size: clamp(0.85rem, 3vw, 0.98rem);
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .stat-val {
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      font-weight: 800;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="fullscreen-stage" id="fullscreenStage">
    <!-- Top Story Segmented Bars -->
    <div class="story-progress-wrapper" id="storyProgress">
      <div class="story-bar-track"><div class="story-bar-fill"></div></div>
      <div class="story-bar-track"><div class="story-bar-fill"></div></div>
      <div class="story-bar-track"><div class="story-bar-fill"></div></div>
      <div class="story-bar-track"><div class="story-bar-fill"></div></div>
      <div class="story-bar-track"><div class="story-bar-fill"></div></div>
    </div>

    <!-- Top Metadata -->
    <div class="top-meta">
      <div class="author-badge">
        <span class="pulse-dot"></span>
        <span>WANDR. • BANYUWANGI 3H2M</span>
      </div>
      <button class="audio-btn" id="btnAudio" title="Toggle Audio (Gadis Neural)">🔊</button>
    </div>

    <!-- Fullscreen Tap Targets (Left: Prev, Right: Next) -->
    <div class="tap-nav-zone tap-prev" id="tapPrev" title="Tap Kiri: Mundur"></div>
    <div class="tap-nav-zone tap-next" id="tapNext" title="Tap Kanan: Lanjut"></div>

    <!-- Photo Viewport -->
    <div class="photo-viewport" id="photoViewport"></div>

    <!-- Vignette -->
    <div class="vignette-overlay"></div>

    <!-- Choreographed Bottom Card -->
    <div class="bottom-card-stage entered" id="bottomCard">
      <div class="stagger-item">
        <span class="tag-bubble" id="cardTag">✨ KEDATANGAN</span>
      </div>
      <div class="stagger-item">
        <h2 class="hero-title" id="cardTitle">Stasiun Ketapang</h2>
      </div>
      <div class="stagger-item">
        <div class="hero-subtitle" id="cardSubtitle">KA Blambangan Ekspres • 04:44 WIB</div>
      </div>
      <div class="stagger-item">
        <p class="hero-desc" id="cardDesc">Tiba di Stasiun Ketapang menyongsong fajar pesisir Selat Bali, bersiap sarapan Sego Cawuk Kalimas.</p>
      </div>
      <div class="stagger-item">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label" id="label1">Transport</span>
            <span class="stat-val" id="val1">KA Blambangan</span>
          </div>
          <div class="stat-card">
            <span class="stat-label" id="label2">Sarapan</span>
            <span class="stat-val" id="val2">Sego Cawuk</span>
          </div>
          <div class="stat-card">
            <span class="stat-label" id="label3">Meeting Point</span>
            <span class="stat-val" id="val3">Ketapang BWI</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------
    // AUTHENTIC BANYUWANGI WIKIMEDIA COMMONS DATASET
    // -----------------------------------------------------------
    const scenes = [
      {
        tag: "✨ DAY 0 • KEDATANGAN",
        title: "Stasiun Ketapang",
        subtitle: "KA Blambangan Ekspres • 04:44 WIB",
        desc: "Tiba di Stasiun Ketapang menyongsong fajar pesisir Selat Bali, bersiap sarapan Sego Cawuk Kalimas.",
        photo: "https://upload.wikimedia.org/wikipedia/commons/6/66/Stasiun_Banyuwangi_Baru.jpg",
        stats: [
          { l: "Tiba", v: "04:44 WIB" },
          { l: "Sarapan", v: "Sego Cawuk" },
          { l: "Lokasi", v: "Ketapang" }
        ],
        duration: 4800
      },
      {
        tag: "🌲 DAY 1 • HUTAN TREMBESI PURBA",
        title: "De Djawatan Benculuk",
        subtitle: "Kanopi Raksasa Berlumut Alami",
        desc: "Menyusuri magisnya hutan trembesi purba Benculuk yang teduh, disusul santap pedas Nasi Tempong Mak Ndut.",
        photo: "https://upload.wikimedia.org/wikipedia/commons/0/08/De_Djawatan_Benculuk_Forest%2C_Banyuwangi.jpg",
        stats: [
          { l: "Tiket", v: "Rp10.000" },
          { l: "Makan Siang", v: "Mak Ndut" },
          { l: "Check-in", v: "Iglam Paltuding" }
        ],
        duration: 5200
      },
      {
        tag: "🌋 DAY 2 • API BIRU & SUNSET",
        title: "Kawah Ijen & Blue Fire",
        subtitle: "Trekking Dini Hari 01:30 & Kaldera Belerang",
        desc: "Mendaki kawah Ijen menyaksikan api biru langka dan danau kawah toska, dilanjut santai di kabin Iglam.",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Kawah_Ijen_%2827432832286%29.jpg/1280px-Kawah_Ijen_%2827432832286%29.jpg",
        stats: [
          { l: "Tiket Ijen", v: "Rp5.000" },
          { l: "Mata Air", v: "Sendang Seruni" },
          { l: "Kuliner", v: "Mbok Mus" }
        ],
        duration: 5500
      },
      {
        tag: "🌊 DAY 2 SORE • SELAT BALI",
        title: "Pantai Grand Watudodol",
        subtitle: "Menatap Laut Selat Bali & Sunset",
        desc: "Duduk santai di pesisir Grand Watudodol menikmati deburan ombak dan siluet pulau dewata di seberang.",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Watu_dodol.jpg/1280px-Watu_dodol.jpg",
        stats: [
          { l: "Zona", v: "Pesisir Utara" },
          { l: "Malam", v: "Avrila Cafe" },
          { l: "View", v: "Selat Bali" }
        ],
        duration: 5000
      },
      {
        tag: "☕ DAY 3 • BUDAYA & OLEH-OLEH",
        title: "Desa Adat Osing Kemiren",
        subtitle: "Tradisi Sangrai Kopi & Rujak Losari",
        desc: "Menyesap seduhan kopi Osing asli, berburu oleh-oleh bagiak, dan bersiap naik kereta pulang di Ketapang.",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Desa_Kemiren.jpg/1280px-Desa_Kemiren.jpg",
        stats: [
          { l: "Tiket Desa", v: "Rp15.000" },
          { l: "Kuliner", v: "Losari No.39" },
          { l: "Boarding", v: "15:50 WIB" }
        ],
        duration: 5200
      }
    ];

    let currentIdx = 0;
    let isPaused = false;
    let startTime = null;
    let progressTimer = null;
    let elapsedBeforePause = 0;

    // DOM Elements
    const photoViewport = document.getElementById('photoViewport');
    const bottomCard = document.getElementById('bottomCard');
    const cardTag = document.getElementById('cardTag');
    const cardTitle = document.getElementById('cardTitle');
    const cardSubtitle = document.getElementById('cardSubtitle');
    const cardDesc = document.getElementById('cardDesc');
    const label1 = document.getElementById('label1');
    const val1 = document.getElementById('val1');
    const label2 = document.getElementById('label2');
    const val2 = document.getElementById('val2');
    const label3 = document.getElementById('label3');
    const val3 = document.getElementById('val3');
    const fills = document.querySelectorAll('.story-bar-fill');
    const stage = document.getElementById('fullscreenStage');

    // 1. Preload Background Photos
    scenes.forEach((s, i) => {
      const imgDiv = document.createElement('div');
      imgDiv.className = 'bg-photo' + (i === 0 ? ' active' : '');
      imgDiv.style.backgroundImage = `url('${s.photo}')`;
      imgDiv.id = `bg-${i}`;
      photoViewport.appendChild(imgDiv);
    });

    // 2. Emil Kowalski Choreographed Scene Transition
    function renderScene(idx) {
      const s = scenes[idx];

      // A. Crossfade & Scale Photo (Composite-Only)
      document.querySelectorAll('.bg-photo').forEach((el, i) => {
        if (i === idx) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      // B. Animate Out Previous Text
      bottomCard.classList.remove('entered');
      bottomCard.classList.add('entering');

      // C. Update Text Values during Exit
      setTimeout(() => {
        cardTag.textContent = s.tag;
        cardTitle.textContent = s.title;
        cardSubtitle.textContent = s.subtitle;
        cardDesc.textContent = s.desc;
        
        label1.textContent = s.stats[0].l; val1.textContent = s.stats[0].v;
        label2.textContent = s.stats[1].l; val2.textContent = s.stats[1].v;
        label3.textContent = s.stats[2].l; val3.textContent = s.stats[2].v;

        // D. Trigger Staggered Entrance
        requestAnimationFrame(() => {
          bottomCard.classList.remove('entering');
          bottomCard.classList.add('entered');
        });
      }, 120);

      // E. Update Bar Fills
      fills.forEach((f, i) => {
        if (i < idx) f.style.width = '100%';
        else if (i > idx) f.style.width = '0%';
        else f.style.width = '0%';
      });

      startProgressLoop();
    }

    // 3. Smooth Story Progress Loop (60FPS requestAnimationFrame)
    function startProgressLoop() {
      if (progressTimer) cancelAnimationFrame(progressTimer);
      startTime = performance.now();
      const currentDuration = scenes[currentIdx].duration;

      function loop(now) {
        if (isPaused) {
          progressTimer = requestAnimationFrame(loop);
          return;
        }

        const delta = (now - startTime) + elapsedBeforePause;
        const progress = Math.min(delta / currentDuration, 1.0);
        fills[currentIdx].style.width = `${progress * 100}%`;

        if (progress >= 1.0) {
          elapsedBeforePause = 0;
          nextScene();
        } else {
          progressTimer = requestAnimationFrame(loop);
        }
      }

      progressTimer = requestAnimationFrame(loop);
    }

    function nextScene() {
      elapsedBeforePause = 0;
      if (currentIdx < scenes.length - 1) {
        currentIdx++;
      } else {
        currentIdx = 0; // Loop back
      }
      renderScene(currentIdx);
    }

    function prevScene() {
      elapsedBeforePause = 0;
      if (currentIdx > 0) {
        currentIdx--;
      } else {
        currentIdx = 0;
      }
      renderScene(currentIdx);
    }

    // 4. Tap Navigation directly on Image Screen
    document.getElementById('tapNext').addEventListener('click', (e) => {
      e.stopPropagation();
      nextScene();
    });
    document.getElementById('tapPrev').addEventListener('click', (e) => {
      e.stopPropagation();
      prevScene();
    });

    // Hold screen to Pause (Instagram Reels pattern)
    let touchStartTime = 0;
    stage.addEventListener('touchstart', (e) => {
      if (e.target.closest('#btnAudio')) return;
      touchStartTime = Date.now();
      isPaused = true;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      if (e.target.closest('#btnAudio')) return;
      isPaused = false;
    }, { passive: true });

    // Sound toggle badge
    let isMuted = false;
    document.getElementById('btnAudio').addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      document.getElementById('btnAudio').textContent = isMuted ? '🔇' : '🔊';
    });

    // Kickoff
    renderScene(0);
  </script>
</body>
</html>
