<!doctype html>
<html lang="id">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wandr Reel • 9:16 Visual Itinerary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    /* Master 100% Full-bleed Viewport */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #reelCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Top Segment Story Bars */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: env(safe-area-inset-top, 16px) 16px 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .story-bars {
      display: flex;
      gap: 5px;
      width: 100%;
    }
    .bar-segment {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: #f59e0b;
    }

    .top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-pill {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }
    .btn-exit {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 99px;
    }

    /* Touch Tap Zones for Story Navigation */
    .tap-zone {
      position: absolute;
      top: 60px;
      bottom: 120px;
      z-index: 15;
    }
    .tap-left { left: 0; width: 35%; }
    .tap-center { left: 35%; width: 30%; }
    .tap-right { right: 0; width: 35%; }

    /* Bottom Floating Action Bar */
    .hud-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px calc(env(safe-area-inset-bottom, 16px) + 12px);
      background: linear-gradient(0deg, rgba(2,6,23,0.95) 0%, rgba(2,6,23,0.7) 60%, rgba(2,6,23,0) 100%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-action {
      flex: 1;
      height: 50px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease;
    }
    .btn-action:active { transform: scale(0.96); }
    .btn-play {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);
    }
    .btn-skip {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="stage">
    <canvas id="reelCanvas" width="1080" height="1920"></canvas>

    <!-- Top HUD: Segmented Story Bar -->
    <div class="hud-top">
      <div class="story-bars" id="storyBars"></div>
      <div class="top-meta">
        <div class="badge-wrap">
          <div class="brand-pill">
            <span class="brand-dot"></span>
            <span id="badgeText">WANDR REELS • BANYUWANGI</span>
          </div>
        </div>
        <a href="../index.html" class="btn-exit">✕ Keluar</a>
      </div>
    </div>

    <!-- Tap Navigation Zones (like IG Stories) -->
    <div class="tap-zone tap-left" id="tapPrev"></div>
    <div class="tap-zone tap-center" id="tapPause"></div>
    <div class="tap-zone tap-right" id="tapNext"></div>

    <!-- Bottom Controls -->
    <div class="hud-bottom">
      <button class="btn-action btn-play" id="btnPlay">⏸ Jeda Video</button>
      <button class="btn-action btn-skip" id="btnNext">Lanjut ⏭</button>
    </div>
  </div>

  <script>
        // ══════════════════════════════════════════════════════════

    "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Pulau_Tabuhan.jpg/1280px-Pulau_Tabuhan.jpg",

  "pantai_boom": {

    "tag": "MARINA IKONIK & JEMBATAN SPIRAL",
    "desc": "Pusat rekreasi pesisir kota dengan jembatan spiral megah berlatar belakang siluet pulau dewata Bali.",
    "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Pantai_Boom_Banyuwangi.jpg/1280px-Pantai_Boom_Banyuwangi.jpg",
    "accent": "#f43f5e"
  },
  "boom": {
    "title": "Pantai Boom Marina",
    "tag": "MARINA IKONIK & JEMBATAN SPIRAL",
    "desc": "Pusat rekreasi pesisir kota dengan jembatan spiral megah berlatar belakang siluet pulau dewata Bali.",
    "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Pantai_Boom_Banyuwangi.jpg/1280px-Pantai_Boom_Banyuwangi.jpg",
    "accent": "#f43f5e"
  },
  "g_land": {
    "title": "G-Land Plengkung",
    "tag": "OMBAK TERCEPAT KEDUA DI DUNIA",
    "desc": "Kiblat peselancar profesional dunia dengan gulungan ombak sempurna 7 susun di ujung Alas Purwo.",
    "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/G-Land_Plengkung_Beach.jpg/1280px-G-Land_Plengkung_Beach.jpg",
    "accent": "#3b82f6"
  },
  "pantai_wedi": {
    "title": "Pantai Wedi Ireng",
    "tag": "PASIR HITAM & PUTIH EKSOTIS",
    "desc": "Teluk tersembunyi yang unik dengan perpaduan pasir putih dan pasir hitam vulkanik berkilau.",
    "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Wedi_Ireng_Beach.jpg/1280px-Wedi_Ireng_Beach.jpg",
    "accent": "#64748b"
  },
  "city": {
    "title": "Wisata Kota & Kuliner Banyuwangi",
    "tag": "KULINER TRADISIONAL OSING",
    "desc": "Menikmati Sego Tempong pedas menggigit, Rujak Soto khas Blambangan, dan keramahan pusat kota.",
    "img": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Taman_Sritanjung_Banyuwangi.jpg/1280px-Taman_Sritanjung_Banyuwangi.jpg",
    "accent": "#f59e0b"
  }
};

    // Default Highlights jika user belum menyusun itinerary kustom
    const DEFAULT_SCENES = [
      DEST_MEDIA_REGISTRY['ketapang'],
      DEST_MEDIA_REGISTRY['djawatan'],
      DEST_MEDIA_REGISTRY['ijen'],
      DEST_MEDIA_REGISTRY['pulau_merah'],
      DEST_MEDIA_REGISTRY['kemiren']
    ];

    // Fungsi Resolver Cerdas: Mencocokkan ID atau nama tempat ke foto otentik
    function resolveDestinationMedia(item) {
      const id = (item.id || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (DEST_MEDIA_REGISTRY[id]) return DEST_MEDIA_REGISTRY[id];

      const name = (item.name || '').toLowerCase();
      for (const [key, meta] of Object.entries(DEST_MEDIA_REGISTRY)) {
        if (name.includes(key) || key.includes(name) || meta.title.toLowerCase().includes(name)) {
          return meta;
        }
      }

      if (item.cat === 'pantai' || name.includes('pantai') || name.includes('teluk')) {
        return DEST_MEDIA_REGISTRY['pulau_merah'];
      }
      if (item.cat === 'diving' || name.includes('diving') || name.includes('snorkeling')) {
        return DEST_MEDIA_REGISTRY['bangsring'];
      }
      return DEST_MEDIA_REGISTRY['djawatan'];
    }

    let SCENES = [];
    try {
      const stored = localStorage.getItem('wandr_active_itinerary');
      if (stored) {
        const userList = JSON.parse(stored);
        if (Array.isArray(userList) && userList.length > 0) {
          const seen = new Set();
          userList.forEach(item => {
            const key = item.id || item.name;
            if (!seen.has(key) && seen.size < 7) {
              seen.add(key);
              const resolved = resolveDestinationMedia(item);
              SCENES.push({
                tag: `HARI ${item.day || 1} • ${resolved.tag || 'DESTINASI'}`,
                title: resolved.title,
                desc: resolved.desc,
                duration: 4.5,
                imgUrl: resolved.img,
                accent: resolved.accent
              });
            }
          });
        }
      }
    } catch(e) {
      console.warn('Pakai default itinerary:', e);
    }

    if (!SCENES || SCENES.length === 0) {
      SCENES = DEFAULT_SCENES.map(s => ({ ...s, duration: 4.5, imgUrl: s.img }));
    }

    const W = 1080, H = 1920;
    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');
    const storyBars = document.getElementById('storyBars');
    const btnPlay = document.getElementById('btnPlay');
    const btnNext = document.getElementById('btnNext');

    // Preload semua gambar asli
    const loadedImages = {};
    SCENES.forEach(s => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = s.imgUrl;
      loadedImages[s.imgUrl] = img;
    });

    // Buat segmented story bar
    storyBars.innerHTML = SCENES.map((_, i) => `
      <div class="bar-segment">
        <div class="bar-fill" id="fill_${i}"></div>
      </div>
    `).join('');

    let currentSceneIdx = 0;
    let isPlaying = true;
    let sceneStartTime = performance.now();
    let animId = null;

    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const easeOutCubic = x => 1 - Math.pow(1 - clamp(x), 3);
    const prog = (t, a, b) => clamp((t - a) / (b - a));

    function renderFrame(t) {
      const s = SCENES[currentSceneIdx];
      const img = loadedImages[s.imgUrl];

      ctx.clearRect(0, 0, W, H);

      // 1. Gambar Foto Asli dengan Efek Ken Burns (Zoom Pelan Deterministik)
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.save();
        const zoom = 1 + 0.08 * (t / s.duration);
        ctx.translate(W / 2, H / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-W / 2, -H / 2);

        // Aspect ratio cover fill
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const canvasRatio = W / H;
        let dw, dh, dx, dy;
        if (imgRatio > canvasRatio) {
          dh = H;
          dw = H * imgRatio;
          dx = (W - dw) / 2;
          dy = 0;
        } else {
          dw = W;
          dh = W / imgRatio;
          dx = 0;
          dy = (H - dh) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      } else {
        // Fallback gradient jika gambar masih loading
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#0f172a');
        bgGrad.addColorStop(1, '#020617');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
      }

      // 2. Cinematic Vignette & Bottom Gradient Overlay
      const grad = ctx.createLinearGradient(0, H * 0.4, 0, H);
      grad.addColorStop(0, 'rgba(2, 6, 23, 0)');
      grad.addColorStop(0.35, 'rgba(2, 6, 23, 0.6)');
      grad.addColorStop(0.7, 'rgba(2, 6, 23, 0.92)');
      grad.addColorStop(1, 'rgba(2, 6, 23, 0.98)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 3. Kinetic Typography (Title, Tag, Description)
      const FONT = '"Plus Jakarta Sans", sans-serif';

      // Tagline Hari & Waktu
      const tagP = easeOutCubic(prog(t, 0.15, 0.6));
      ctx.globalAlpha = tagP;
      ctx.fillStyle = s.accent;
      ctx.font = `800 32px ${FONT}`;
      ctx.textAlign = 'left';
      ctx.fillText(s.tag, 60, H - 380 - (1 - tagP) * 20);

      // Judul Destinasi Utama
      const titleP = easeOutCubic(prog(t, 0.3, 0.8));
      ctx.globalAlpha = titleP;
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 76px ${FONT}`;
      ctx.fillText(s.title, 60, H - 280 - (1 - titleP) * 30);

      // Deskripsi Menarik
      const descP = easeOutCubic(prog(t, 0.5, 1.0));
      ctx.globalAlpha = descP;
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `500 34px ${FONT}`;

      // Word wrapping sederhana untuk deskripsi (maksimal lebar 940px)
      const maxW = 960;
      const words = s.desc.split(' ');
      let line = '';
      let lineY = H - 200 - (1 - descP) * 20;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxW && n > 0) {
          ctx.fillText(line, 60, lineY);
          line = words[n] + ' ';
          lineY += 50;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 60, lineY);

      ctx.globalAlpha = 1.0;
    }

    function tick() {
      if (!isPlaying) return;
      const now = performance.now();
      const elapsed = (now - sceneStartTime) / 1000;
      const curScene = SCENES[currentSceneIdx];

      renderFrame(elapsed);

      // Update progress bar
      SCENES.forEach((_, i) => {
        const fill = document.getElementById(`fill_${i}`);
        if (i < currentSceneIdx) fill.style.width = '100%';
        else if (i > currentSceneIdx) fill.style.width = '0%';
        else fill.style.width = Math.min(100, (elapsed / curScene.duration) * 100) + '%';
      });

      if (elapsed >= curScene.duration) {
        if (currentSceneIdx < SCENES.length - 1) {
          currentSceneIdx++;
          sceneStartTime = performance.now();
        } else {
          // Putar ulang dari awal (loop)
          currentSceneIdx = 0;
          sceneStartTime = performance.now();
        }
      }

      animId = requestAnimationFrame(tick);
    }

    function play() {
      isPlaying = true;
      btnPlay.innerHTML = '⏸ Jeda Video';
      sceneStartTime = performance.now();
      animId = requestAnimationFrame(tick);
    }

    function pause() {
      isPlaying = false;
      btnPlay.innerHTML = '▶ Putar Video';
      cancelAnimationFrame(animId);
    }

    function nextScene() {
      currentSceneIdx = (currentSceneIdx + 1) % SCENES.length;
      sceneStartTime = performance.now();
      if (!isPlaying) renderFrame(0);
    }

    function prevScene() {
      currentSceneIdx = (currentSceneIdx - 1 + SCENES.length) % SCENES.length;
      sceneStartTime = performance.now();
      if (!isPlaying) renderFrame(0);
    }

    btnPlay.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    btnNext.addEventListener('click', nextScene);

    // Tap navigasi layar sentuh (kiri: mundur, tengah: jeda, kanan: maju)
    document.getElementById('tapNext').addEventListener('click', nextScene);
    document.getElementById('tapPrev').addEventListener('click', prevScene);
    document.getElementById('tapPause').addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    // Mulai animasi
    play();
  </script>
</body>
</html>
