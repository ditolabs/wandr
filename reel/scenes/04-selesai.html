<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>04 Selesai</title>
  <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
scene(3.5, t => {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#090d16');
  grad.addColorStop(0.5, '#1e1b4b');
  grad.addColorStop(1, '#020617');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const push = 1 + 0.03 * (t / 3.5);
  ctx.translate(W / 2, H / 2);
  ctx.scale(push, push);
  ctx.translate(-W / 2, -H / 2);

  const tagP = easeOutCubic(prog(t, 0.2, 0.7));
  ctx.globalAlpha = tagP;
  ctx.fillStyle = AMBER;
  ctx.font = `800 38px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('JELAJAHI BANYUWANGI BERSAMA', W / 2, 700 - (1 - tagP) * 30);

  const titleP = easeOutCubic(prog(t, 0.4, 1.0));
  ctx.globalAlpha = titleP;
  ctx.fillStyle = WHITE;
  ctx.font = `900 110px ${FONT}`;
  ctx.fillText('WANDR PWA', W / 2, 840 - (1 - titleP) * 40);

  const subP = easeOutCubic(prog(t, 0.7, 1.3));
  ctx.globalAlpha = subP;
  ctx.fillStyle = '#cbd5e1';
  ctx.font = `600 46px ${FONT}`;
  ctx.fillText('Rencanakan Perjalanan Impianmu Sekarang', W / 2, 950 - (1 - subP) * 30);

  const btnP = easeOutCubic(prog(t, 1.0, 1.6));
  ctx.globalAlpha = btnP;
  ctx.fillStyle = AMBER;
  const btnW = 600, btnH = 130, btnX = (W - btnW) / 2, btnY = 1100;
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, btnW, btnH, 32);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.font = `800 44px ${FONT}`;
  ctx.fillText('ditolabs.github.io/wandr', W / 2, btnY + 80);
});
</script>
</body>
</html>
