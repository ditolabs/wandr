<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>01 Arrival</title>
  <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
scene(3.5, t => {
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#020617');
  grad.addColorStop(0.5, '#0f172a');
  grad.addColorStop(1, '#020617');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle camera push-in
  const push = 1 + 0.04 * (t / 3.5);
  ctx.translate(W / 2, H / 2);
  ctx.scale(push, push);
  ctx.translate(-W / 2, -H / 2);

  // Top Tag
  const tagP = easeOutCubic(prog(t, 0.2, 0.7));
  ctx.globalAlpha = tagP;
  ctx.fillStyle = AMBER;
  ctx.font = `800 36px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('WANDR BANYUWANGI • 3D2N', W / 2, 680 - (1 - tagP) * 30);

  // Big Destination Title
  const titleP = easeOutCubic(prog(t, 0.4, 1.0));
  ctx.globalAlpha = titleP;
  ctx.fillStyle = WHITE;
  ctx.font = `900 88px ${FONT}`;
  ctx.fillText('Stasiun Ketapang', W / 2, 800 - (1 - titleP) * 40);

  // Subtitle / Time
  const subP = easeOutCubic(prog(t, 0.7, 1.3));
  ctx.globalAlpha = subP;
  ctx.fillStyle = MUTED;
  ctx.font = `500 42px ${FONT}`;
  ctx.fillText('Hari 1 • 04:44 WIB • Selat Bali', W / 2, 890 - (1 - subP) * 30);

  // Card outline box
  const cardP = easeOutCubic(prog(t, 0.8, 1.4));
  ctx.globalAlpha = cardP * 0.9;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
  const boxW = 860, boxH = 240, boxX = (W - boxW) / 2, boxY = 1050;
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 24);
  ctx.fill();
  ctx.stroke();

  // Caption text inside card
  ctx.fillStyle = '#e2e8f0';
  ctx.font = `500 34px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('Pintu masuk timur Pulau Jawa menyambut', W / 2, boxY + 95);
  ctx.fillText('dengan hembusan sejuk angin pesisir.', W / 2, boxY + 155);

  // Outro fade
  const fadeOut = prog(t, 3.1, 3.5);
  if (fadeOut > 0) {
    ctx.globalAlpha = fadeOut;
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, W, H);
  }
});
</script>
</body>
</html>
