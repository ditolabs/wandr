<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>02 De Djawatan</title>
  <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
scene(3.5, t => {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#061712');
  grad.addColorStop(0.5, '#0d281e');
  grad.addColorStop(1, '#020617');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const push = 1 + 0.04 * (t / 3.5);
  ctx.translate(W / 2, H / 2);
  ctx.scale(push, push);
  ctx.translate(-W / 2, -H / 2);

  const tagP = easeOutCubic(prog(t, 0.2, 0.7));
  ctx.globalAlpha = tagP;
  ctx.fillStyle = '#10b981';
  ctx.font = `800 36px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('HUTAN PURBA BENCULUK', W / 2, 680 - (1 - tagP) * 30);

  const titleP = easeOutCubic(prog(t, 0.4, 1.0));
  ctx.globalAlpha = titleP;
  ctx.fillStyle = WHITE;
  ctx.font = `900 88px ${FONT}`;
  ctx.fillText('De Djawatan', W / 2, 800 - (1 - titleP) * 40);

  const subP = easeOutCubic(prog(t, 0.7, 1.3));
  ctx.globalAlpha = subP;
  ctx.fillStyle = MUTED;
  ctx.font = `500 42px ${FONT}`;
  ctx.fillText('Hari 1 • 08:30 WIB • Trembesi Purba', W / 2, 890 - (1 - subP) * 30);

  const cardP = easeOutCubic(prog(t, 0.8, 1.4));
  ctx.globalAlpha = cardP * 0.9;
  ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
  ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(6, 23, 18, 0.85)';
  const boxW = 860, boxH = 240, boxX = (W - boxW) / 2, boxY = 1050;
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#e2e8f0';
  ctx.font = `500 34px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('Menembus lorong pohon trembesi raksasa berlumut', W / 2, boxY + 95);
  ctx.fillText('layaknya hutan magis di film Lord of the Rings.', W / 2, boxY + 155);

  const fadeOut = prog(t, 3.1, 3.5);
  if (fadeOut > 0) {
    ctx.globalAlpha = fadeOut;
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, W, H);
  }
});
</script>
</body>
</html>
