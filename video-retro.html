<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wandr Video - 16-Bit Retro Pixel Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #181425;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .video-viewport {
      width: 100%;
      max-width: 380px;
      height: 675px;
      background: #262b44;
      border: 8px solid #3a4466;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 0 0 2px #5a6988;
      display: flex;
      flex-direction: column;
      image-rendering: pixelated;
    }
    /* Pixel Top HUD */
    .pixel-hud {
      background: #181425;
      border-bottom: 4px solid #3a4466;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      z-index: 20;
    }
    .hud-stat {
      color: #fee761;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Pixel Canvas Stage */
    .pixel-stage {
      flex: 1;
      position: relative;
      background: #3a4466;
      overflow: hidden;
    }
    /* Animated Pixel Day/Night Sky */
    .pixel-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #3b5dc9 0%, #68aed4 60%, #5b6ee1 100%);
      transition: background 1.5s ease;
    }
    .pixel-sky.night {
      background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%);
    }
    /* 8-bit Tile Ground */
    .pixel-ground {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 180px;
      background: #566c86;
      border-top: 6px solid #8b9bb4;
      background-image: radial-gradient(#3a4466 15%, transparent 16%);
      background-size: 16px 16px;
    }
    /* Pixel Character Sprite */
    .pixel-hero {
      position: absolute;
      bottom: 120px;
      left: 60px;
      width: 52px;
      height: 60px;
      background: #ff0044;
      border: 4px solid #000;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 8px 0 rgba(0,0,0,0.4);
      z-index: 10;
      animation: pixelWalk 0.6s infinite alternate steps(2);
      transition: left 0.8s ease-in-out;
    }
    @keyframes pixelWalk {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    /* Landmark Visual */
    .pixel-landmark {
      position: absolute;
      bottom: 130px;
      right: 40px;
      font-size: 4.5rem;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.5));
      animation: landmarkHover 2s infinite ease-in-out;
    }
    @keyframes landmarkHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    /* Harvest Moon Dialogue Box */
    .dialogue-box {
      position: absolute;
      bottom: 20px;
      left: 14px; right: 14px;
      background: #fbf5ef;
      border: 4px solid #5d4037;
      border-radius: 12px;
      padding: 12px 14px;
      color: #3e2723;
      box-shadow: 0 8px 0 rgba(0,0,0,0.4);
      z-index: 25;
    }
    .dialogue-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      border-bottom: 2px dashed #8d6e63;
      padding-bottom: 4px;
    }
    .dialogue-speaker {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      font-weight: bold;
      color: #d84315;
    }
    .dialogue-text {
      font-size: 0.82rem;
      line-height: 1.4;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="video-viewport">
    <div class="pixel-hud">
      <div class="hud-stat">❤️ <span id="hearts">5/5</span></div>
      <div class="hud-stat">🪙 <span id="coins">2.500K</span></div>
      <div class="hud-stat" id="hudClock">⏰ 08:00</div>
    </div>

    <div class="pixel-stage">
      <div class="pixel-sky" id="pixelSky"></div>
      
      <!-- Scenery Clouds -->
      <div style="position: absolute; top: 40px; left: 20px; font-size: 2.5rem; opacity: 0.8;">☁️</div>
      <div style="position: absolute; top: 70px; right: 30px; font-size: 2rem; opacity: 0.6;">☁️</div>

      <!-- Landmark -->
      <div class="pixel-landmark" id="landmarkIcon">🌳</div>

      <div class="pixel-ground"></div>

      <!-- Pixel Hero -->
      <div class="pixel-hero" id="heroSprite">🎒</div>

      <!-- Harvest Moon Dialogue -->
      <div class="dialogue-box">
        <div class="dialogue-header">
          <span>🎒</span>
          <span class="dialogue-speaker" id="speakerName">DESTINASI 03</span>
        </div>
        <div class="dialogue-text" id="dialogueText">
          "Sampai di Hutan De Djawatan! Pepohonan trembesi purba bikin suasana terasa magis seperti di film fantasi."
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top: 16px;">
    <a href="video.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: 700;">← Kembali ke Hub Video</a>
  </div>

  <script>
    const stages = [
      { clock: "04:44", dest: "01. STASIUN KETAPANG", icon: "🚂", text: "Kereta tiba di Banyuwangi! Bersiap sarapan Sego Cawuk khas Kalimas.", night: false, heroX: 60 },
      { clock: "08:00", dest: "03. DE DJAWATAN", icon: "🌳", text: "Pohon trembesi raksasa berlumut. Spot foto terbaik saat sinar mentari menembus dahan.", night: false, heroX: 180 },
      { clock: "01:30", dest: "07. KAWAH IJEN", icon: "🌋", text: "Pendakian dini hari di kaldera Ijen. Api biru (Blue Fire) menyala dramatis di dasar danau kawah!", night: true, heroX: 100 },
      { clock: "08:00", dest: "13. DESA ADAT KEMIREN", icon: "☕", text: "Menikmati seduhan Kopi Osing dan belajar adat tradisi suku Osing yang autentik.", night: false, heroX: 200 }
    ];

    let current = 0;
    setInterval(() => {
      current = (current + 1) % stages.length;
      const s = stages[current];

      document.getElementById('hudClock').textContent = '⏰ ' + s.clock;
      document.getElementById('speakerName').textContent = s.dest;
      document.getElementById('landmarkIcon').textContent = s.icon;
      document.getElementById('dialogueText').textContent = '"' + s.text + '"';
      document.getElementById('heroSprite').style.left = s.heroX + 'px';
      
      const sky = document.getElementById('pixelSky');
      if (s.night) {
        sky.classList.add('night');
      } else {
        sky.classList.remove('night');
      }
    }, 3200);
  </script>
</body>
</html>
