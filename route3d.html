<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wandr 3D Route • Animated Itinerary & GPX Player</title>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --primary: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.4);
      --bg-dark: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      display: block;
    }

    /* ── Top Telemetry HUD ────────────────────────────────────────── */
    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .telemetry-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    .dest-info h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dest-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stat-badge {
      text-align: right;
    }

    .stat-badge .val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .stat-badge .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, var(--primary));
      transition: width 0.1s linear;
    }

    /* ── Floating Stop Card (Modal Milestone) ─────────────────────── */
    .milestone-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 20px;
      width: calc(100vw - 48px);
      max-width: 360px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--primary-glow);
    }

    .milestone-popup.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .milestone-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .milestone-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .milestone-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .milestone-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
    }

    .milestone-stats .m-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .milestone-stats .m-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .btn-resume {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    /* ── Bottom Controls Dock ─────────────────────────────────────── */
    .hud-bottom {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-dock {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .dock-btn {
      flex: 1;
      height: 44px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dock-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.12);
    }

    .dock-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      font-weight: 700;
    }

    .dock-btn.record-btn {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .dock-btn.record-btn.recording {
      animation: pulse-red 1s infinite;
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.97); }
    }

    /* Upload button hidden file input */
    #gpx-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Top Telemetry HUD -->
  <div class="hud-top">
    <div class="telemetry-card">
      <div class="dest-info">
        <h2 id="hud-dest-title">📍 Stasiun Ketapang</h2>
        <p id="hud-dest-sub">Hari 1 • Titik Kumpul & Mulai</p>
      </div>
      <div class="stat-badge">
        <div class="val" id="hud-dist-val">0.0 <span style="font-size:0.75rem">KM</span></div>
        <div class="lbl" id="hud-ele-val">34 m dpl</div>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="hud-progress"></div>
    </div>
  </div>

  <!-- Milestone Landmark Popup -->
  <div class="milestone-popup" id="milestone-modal">
    <span class="milestone-badge" id="m-badge">DESTINASI • HARI 1</span>
    <h3 class="milestone-title" id="m-title">Stasiun Ketapang</h3>
    <p class="milestone-desc" id="m-desc">Pintu gerbang kedatangan kereta api di Banyuwangi timur.</p>
    <div class="milestone-stats">
      <div>
        <div class="m-val" id="m-time">04:44</div>
        <div class="m-lbl">Tiba</div>
      </div>
      <div>
        <div class="m-val" id="m-dist">0.0 km</div>
        <div class="m-lbl">Jarak</div>
      </div>
      <div>
        <div class="m-val" id="m-ele">12 m</div>
        <div class="m-lbl">Elevasi</div>
      </div>
    </div>
    <button class="btn-resume" id="btn-continue-trip">Lanjut Perjalanan ▶</button>
  </div>

  <!-- Bottom Controls Dock -->
  <div class="hud-bottom">
    <div class="controls-dock">
      <button class="dock-btn active" id="btn-play-pause">⏸ Pause</button>
      <button class="dock-btn" id="btn-speed">⚡ 1x</button>
      <button class="dock-btn" id="btn-avatar">🚙 Jeep</button>
      <button class="dock-btn" id="btn-cam">🎥 Follow</button>
      <button class="dock-btn record-btn" id="btn-record">🔴 Rekam</button>
      <button class="dock-btn" id="btn-upload-gpx">📂 GPX</button>
    </div>
  </div>

  <input type="file" id="gpx-file-input" accept=".gpx,.xml" />

  <script>
    /* ── 1. Itinerary Data (Banyuwangi 16 Milestones) ───────────────── */
    const defaultRoute = [
      { name: "Stasiun Ketapang", lat: -8.1456, lon: 114.3975, ele: 12, time: "04:44", day: 1, desc: "Pintu gerbang kedatangan kereta api di Banyuwangi timur." },
      { name: "Sego Cawuk Kalimas", lat: -8.2120, lon: 114.3680, ele: 35, time: "06:00", day: 1, desc: "Sarapan kuliner khas Osing berkuah parutan kelapa pedas gurih." },
      { name: "Hutan De Djawatan", lat: -8.4230, lon: 114.2050, ele: 48, time: "08:00", day: 1, desc: "Hutan trembesi kanopi raksasa ala Lord of the Rings Benculuk." },
      { name: "Nasi Tempong Mak Ndut", lat: -8.3850, lon: 114.2800, ele: 60, time: "12:00", day: 1, desc: "Makan siang sambal tempong tomat ranti super pedas khas Rogojampi." },
      { name: "Srengenge Wetan Resto", lat: -8.2150, lon: 114.3650, ele: 40, time: "14:30", day: 1, desc: "Santai sore & ngopi di resto heritage pusat kota Banyuwangi." },
      { name: "Iglam Blue Fire Paltuding", lat: -8.0750, lon: 114.2420, ele: 1850, time: "17:30", day: 1, desc: "Check-in glamping sejuk di lereng pos pendakian Paltuding Ijen." },
      { name: "Kawah Ijen Blue Fire", lat: -8.0580, lon: 114.2420, ele: 2386, time: "01:30", day: 2, desc: "Trekking api biru abadi dan danau kawah asam toska terluas dunia." },
      { name: "Sendang Seruni & Batu Ampar", lat: -8.1850, lon: 114.2850, ele: 420, time: "10:30", day: 2, desc: "Mata air alami sejuk berlatar tebing rimbun di Tamansari." },
      { name: "Rujak Soto Mbok Mus", lat: -8.2550, lon: 114.3450, ele: 85, time: "13:00", day: 2, desc: "Kuliner legendaris perpaduan rujak petis kacang disiram kuah soto babat." },
      { name: "Pantai Grand Watudodol", lat: -8.1050, lon: 114.4120, ele: 5, time: "15:30", day: 2, desc: "Pantai panorama Selat Bali dengan deretan pohon kelapa dan batuan eksotis." },
      { name: "Avrila Cafe Tamansari", lat: -8.1950, lon: 114.2800, ele: 350, time: "19:00", day: 2, desc: "Makan malam santai kopi arabika Ijen dengan pemandangan pegunungan." },
      { name: "Desa Adat Kemiren", lat: -8.2050, lon: 114.3200, ele: 210, time: "07:30", day: 3, desc: "Kampung budaya suku Osing, sanggar kopi jaran goyang & rumah adat." },
      { name: "Rujak Soto Losari No. 39", lat: -8.2190, lon: 114.3680, ele: 25, time: "10:00", day: 3, desc: "Makan siang kuliner ikonik Losari sebelum pulang." },
      { name: "Pusat Oleh-Oleh Osing", lat: -8.2250, lon: 114.3600, ele: 30, time: "11:30", day: 3, desc: "Belanja kue bagiak kelapa, kopi osing, dan batik gajah oling." },
      { name: "Stasiun Ketapang (Drop-Off)", lat: -8.1456, lon: 114.3975, ele: 12, time: "14:00", day: 3, desc: "Selesai tour & boarding Kereta Api Blambangan Ekspres." }
    ];

    let currentWaypoints = [...defaultRoute];

    /* ── 2. Three.js Scene Setup ───────────────────────────────────── */
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1128);
    scene.fog = new THREE.FogExp2(0x0a1128, 0.0035);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 3000);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffedd5, 1.2);
    dirLight.position.set(120, 250, 150);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Decorative Ground Plane
    const groundGeo = new THREE.PlaneGeometry(1600, 1600, 40, 40);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vy = pos.getY(i);
      pos.setZ(i, Math.sin(vx * 0.015) * Math.cos(vy * 0.015) * 8);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshLambertMaterial({
      color: 0x0f1f38,
      flatShading: true
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Low-poly Decorative Trees
    const treeGroup = new THREE.Group();
    for (let i = 0; i < 90; i++) {
      const rx = (Math.random() - 0.5) * 600;
      const rz = (Math.random() - 0.5) * 600;
      if (Math.hypot(rx, rz) < 60) continue;
      
      const trunkGeo = new THREE.CylinderGeometry(0.5, 0.8, 4, 5);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3d2817 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.set(rx, 2, rz);
      
      const folGeo = new THREE.ConeGeometry(3.5, 8, 5);
      const folMat = new THREE.MeshLambertMaterial({ color: 0x14532d });
      const foliage = new THREE.Mesh(folGeo, folMat);
      foliage.position.set(rx, 7, rz);
      
      treeGroup.add(trunk);
      treeGroup.add(foliage);
    }
    scene.add(treeGroup);

    /* ── 3. Build 3D Curve from Route GPS ─────────────────────────── */
    let splineCurve, pathPoints, routeMesh, travelledMesh;
    const milestonePins = [];

    function buildRouteSpline(points) {
      if (routeMesh) scene.remove(routeMesh);
      if (travelledMesh) scene.remove(travelledMesh);
      milestonePins.forEach(p => scene.remove(p));
      milestonePins.length = 0;

      const lats = points.map(p => p.lat);
      const lons = points.map(p => p.lon);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);
      const spanLat = maxLat - minLat || 0.1;
      const spanLon = maxLon - minLon || 0.1;
      const scaleXZ = 400;

      const v3Points = points.map((p, idx) => {
        const x = ((p.lon - minLon) / spanLon - 0.5) * scaleXZ;
        const z = -((p.lat - minLat) / spanLat - 0.5) * scaleXZ;
        const y = Math.min(Math.max((p.ele || 10) * 0.04, 3), 90);
        return new THREE.Vector3(x, y, z);
      });

      splineCurve = new THREE.CatmullRomCurve3(v3Points, false, 'catmullrom', 0.2);
      pathPoints = splineCurve.getPoints(300);

      const tubeGeo = new THREE.TubeGeometry(splineCurve, 200, 1.2, 8, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.7 });
      routeMesh = new THREE.Mesh(tubeGeo, tubeMat);
      scene.add(routeMesh);

      const glowMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      travelledMesh = new THREE.Mesh(new THREE.BufferGeometry(), glowMat);
      scene.add(travelledMesh);

      points.forEach((p, idx) => {
        const u = idx / (points.length - 1);
        const pinPos = splineCurve.getPointAt(u);

        const pinGroup = new THREE.Group();
        pinGroup.position.copy(pinPos);

        const stalk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.2, 8, 6),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        stalk.position.y = 4;
        pinGroup.add(stalk);

        const pinHead = new THREE.Mesh(
          new THREE.SphereGeometry(1.8, 12, 12),
          new THREE.MeshLambertMaterial({ color: idx === 0 ? 0x10b981 : (idx === points.length - 1 ? 0xef4444 : 0xf59e0b) })
        );
        pinHead.position.y = 8;
        pinGroup.add(pinHead);

        scene.add(pinGroup);
        milestonePins.push({ group: pinGroup, data: p, u: u });
      });
    }

    buildRouteSpline(currentWaypoints);

    /* ── 4. Stylized 3D Avatar Vehicles (Procedural) ───────────────── */
    const vehicleGroup = new THREE.Group();
    scene.add(vehicleGroup);

    let vehicleType = 'jeep';

    function buildJeepMesh() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.8, 6), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
      body.position.y = 1.4;
      body.castShadow = true;
      g.add(body);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.5, 3.5), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
      cabin.position.set(0, 2.8, -0.6);
      g.add(cabin);

      const hlMat = new THREE.MeshBasicMaterial({ color: 0xfffbeb });
      const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 6), hlMat);
      hl1.position.set(-1.1, 1.6, 3.05);
      const hl2 = hl1.clone();
      hl2.position.x = 1.1;
      g.add(hl1);
      g.add(hl2);

      const wheelMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
      const wGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.6, 12);
      wGeo.rotateZ(Math.PI / 2);
      const wheels = [
        [-1.8, 0.8, 2], [1.8, 0.8, 2],
        [-1.8, 0.8, -2], [1.8, 0.8, -2]
      ];
      wheels.forEach(pos => {
        const w = new THREE.Mesh(wGeo, wheelMat);
        w.position.set(...pos);
        g.add(w);
      });

      return g;
    }

    function buildRunnerMesh() {
      const g = new THREE.Group();
      const head = new THREE.Mesh(new THREE.SphereGeometry(1.2, 10, 10), new THREE.MeshLambertMaterial({ color: 0xfde047 }));
      head.position.y = 4.2;
      g.add(head);

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.9, 2.2, 8), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
      torso.position.y = 2.4;
      g.add(torso);

      const pack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.8), new THREE.MeshLambertMaterial({ color: 0x3b82f6 }));
      pack.position.set(0, 2.5, -0.9);
      g.add(pack);
      return g;
    }

    let activeAvatar = buildJeepMesh();
    vehicleGroup.add(activeAvatar);

    /* ── 5. Animation Engine & Telemetry ───────────────────────────── */
    let progress = 0;
    let isPlaying = true;
    let speedMult = 1.0;
    let cameraMode = 'follow';
    let lastTime = performance.now();
    let isMilestonePaused = false;
    let passedMilestones = new Set();

    function updateTelemetryHUD(u) {
      const totalKm = 88.5;
      const currentKm = (u * totalKm).toFixed(1);
      document.getElementById('hud-dist-val').innerHTML = `${currentKm} <span style="font-size:0.75rem">KM</span>`;
      document.getElementById('hud-progress').style.width = `${(u * 100).toFixed(1)}%`;

      let nearestIdx = Math.floor(u * (currentWaypoints.length - 1));
      nearestIdx = Math.min(Math.max(nearestIdx, 0), currentWaypoints.length - 1);
      const wp = currentWaypoints[nearestIdx];

      document.getElementById('hud-dest-title').innerHTML = `📍 ${wp.name}`;
      document.getElementById('hud-dest-sub').innerText = `Hari ${wp.day || 1} • Pukul ${wp.time} WIB`;
      document.getElementById('hud-ele-val').innerText = `${wp.ele || 15} m dpl`;
    }

    function triggerMilestonePopup(ms) {
      isMilestonePaused = true;
      const wp = ms.data;
      document.getElementById('m-badge').innerText = `DESTINASI • HARI ${wp.day || 1}`;
      document.getElementById('m-title').innerText = wp.name;
      document.getElementById('m-desc').innerText = wp.desc;
      document.getElementById('m-time').innerText = wp.time;
      document.getElementById('m-dist').innerText = `${(ms.u * 88.5).toFixed(1)} km`;
      document.getElementById('m-ele').innerText = `${wp.ele || 15} m`;

      document.getElementById('milestone-modal').classList.add('active');

      setTimeout(() => {
        resumeTrip();
      }, 3500);
    }

    function resumeTrip() {
      document.getElementById('milestone-modal').classList.remove('active');
      isMilestonePaused = false;
    }
    document.getElementById('btn-continue-trip').addEventListener('click', resumeTrip);

    /* ── 6. Render Loop ────────────────────────────────────────────── */
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (isPlaying && !isMilestonePaused && splineCurve) {
        const step = 0.035 * speedMult * delta;
        progress = (progress + step);
        if (progress > 1) {
          progress = 0;
          passedMilestones.clear();
        }

        const curPos = splineCurve.getPointAt(progress);
        const tangent = splineCurve.getTangentAt(progress).normalize();

        vehicleGroup.position.copy(curPos);

        const lookTarget = curPos.clone().add(tangent);
        vehicleGroup.lookAt(lookTarget);

        if (vehicleType === 'jeep') {
          activeAvatar.position.y = Math.sin(now * 0.015) * 0.2;
        } else {
          activeAvatar.position.y = Math.abs(Math.sin(now * 0.018)) * 0.5;
        }

        if (cameraMode === 'follow') {
          const camOffset = tangent.clone().multiplyScalar(-24).add(new THREE.Vector3(0, 11, 0));
          const targetCamPos = curPos.clone().add(camOffset);
          camera.position.lerp(targetCamPos, 0.08);
          camera.lookAt(curPos.clone().add(new THREE.Vector3(0, 3, 0)));
        } else if (cameraMode === 'drone') {
          const droneOffset = new THREE.Vector3(35, 45, 35);
          camera.position.lerp(curPos.clone().add(droneOffset), 0.05);
          camera.lookAt(curPos);
        } else if (cameraMode === 'top') {
          const topPos = new THREE.Vector3(curPos.x, 140, curPos.z + 0.1);
          camera.position.lerp(topPos, 0.06);
          camera.lookAt(curPos);
        }

        milestonePins.forEach(ms => {
          if (!passedMilestones.has(ms) && Math.abs(progress - ms.u) < 0.018) {
            passedMilestones.add(ms);
            triggerMilestonePopup(ms);
          }
        });

        updateTelemetryHUD(progress);
      }

      renderer.render(scene, camera);
    }
    animate();

    /* ── 7. UI Controls Interactivity ──────────────────────────────── */
    const playBtn = document.getElementById('btn-play-pause');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
      playBtn.classList.toggle('active', isPlaying);
    });

    const speedBtn = document.getElementById('btn-speed');
    const speeds = [1.0, 2.0, 4.0];
    let sIdx = 0;
    speedBtn.addEventListener('click', () => {
      sIdx = (sIdx + 1) % speeds.length;
      speedMult = speeds[sIdx];
      speedBtn.innerText = `⚡ ${speedMult}x`;
    });

    const avatarBtn = document.getElementById('btn-avatar');
    avatarBtn.addEventListener('click', () => {
      vehicleGroup.remove(activeAvatar);
      if (vehicleType === 'jeep') {
        vehicleType = 'runner';
        avatarBtn.innerText = "🏃 Runner";
        activeAvatar = buildRunnerMesh();
      } else {
        vehicleType = 'jeep';
        avatarBtn.innerText = "🚙 Jeep";
        activeAvatar = buildJeepMesh();
      }
      vehicleGroup.add(activeAvatar);
    });

    const camBtn = document.getElementById('btn-cam');
    camBtn.addEventListener('click', () => {
      if (cameraMode === 'follow') {
        cameraMode = 'drone';
        camBtn.innerText = "🚁 Drone";
      } else if (cameraMode === 'drone') {
        cameraMode = 'top';
        camBtn.innerText = "🗺️ Top";
      } else {
        cameraMode = 'follow';
        camBtn.innerText = "🎥 Follow";
      }
    });

    /* ── 8. Direct Canvas Video Recording (9:16 Video Export) ───────── */
    const recBtn = document.getElementById('btn-record');
    let mediaRecorder = null;
    let recordedChunks = [];

    recBtn.addEventListener('click', () => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        recordedChunks = [];
        const stream = canvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `wandr_3d_route_${Date.now()}.webm`;
          a.click();
          recBtn.innerText = "🔴 Rekam";
          recBtn.classList.remove('recording');
        };

        mediaRecorder.start();
        recBtn.innerText = "⏹ Stop";
        recBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
      }
    });

    /* ── 9. GPX File Upload Parser ─────────────────────────────────── */
    const gpxBtn = document.getElementById('btn-upload-gpx');
    const gpxInput = document.getElementById('gpx-file-input');

    gpxBtn.addEventListener('click', () => gpxInput.click());

    gpxInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "application/xml");
        const trkpts = xml.querySelectorAll("trkpt");

        if (trkpts.length < 2) {
          alert("Berkas GPX tidak memiliki titik koordinat rute <trkpt> yang cukup!");
          return;
        }

        const parsedPoints = [];
        const step = Math.max(1, Math.floor(trkpts.length / 50));
        for (let i = 0; i < trkpts.length; i += step) {
          const pt = trkpts[i];
          const lat = parseFloat(pt.getAttribute("lat"));
          const lon = parseFloat(pt.getAttribute("lon"));
          const eleNode = pt.querySelector("ele");
          const ele = eleNode ? parseFloat(eleNode.textContent) : 20;
          parsedPoints.push({
            name: `Titik GPS #${parsedPoints.length + 1}`,
            lat, lon, ele,
            time: `Km ${(parsedPoints.length * 1.5).toFixed(1)}`,
            desc: "Titik rute kustom dari berkas GPX pengguna."
          });
        }

        currentWaypoints = parsedPoints;
        progress = 0;
        passedMilestones.clear();
        buildRouteSpline(currentWaypoints);
        alert(`Berhasil memuat rute GPX: ${parsedPoints.length} titik koordinat 3D!`);
      };
      reader.readAsText(file);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
