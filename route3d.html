<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JejakLari 3D • Video Animasi Rute Lari & GPX Player</title>

  <!-- MapLibre GL JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    :root {
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.45);
      --green: #10b981;
      --yellow: #facc15;
      --pink: #f43f5e;
      --card-bg: rgba(15, 23, 42, 0.90);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
    }

    /* ── Top Left Activity Info Card ──────────────────────────────── */
    .hud-header {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      max-width: 250px;
      pointer-events: auto;
    }

    .hud-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.65rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .hud-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .hud-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-meta {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.35;
    }

    /* ── Top Right Mini GPS Overview ──────────────────────────────── */
    .hud-minimap {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      width: 84px;
      height: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .minimap-lbl {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.55rem;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    #minimap-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ── Bottom Telemetry Dashboard ───────────────────────────────── */
    .hud-dashboard {
      position: fixed;
      bottom: 74px;
      left: 14px;
      right: 14px;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px 16px 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .dash-dist {
      font-size: 1.55rem;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .dash-dist-target {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .dash-time {
      font-size: 1.05rem;
      font-weight: 800;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    /* Progress bar */
    .dash-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .dash-progress-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      transition: width 0.1s linear;
    }

    /* 3 Main Stat Cards (Pace, HR, Cadence) */
    .dash-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
    }

    .metric-card .m-lbl {
      font-size: 0.62rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }

    .metric-card .m-val {
      font-size: 1.05rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .m-val.pace { color: var(--yellow); }
    .m-val.hr { color: var(--pink); }
    .m-val.cadence { color: #a855f7; }

    /* Sub Stats Row */
    .dash-sub-row {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      font-size: 0.72rem;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }
    .dash-sub-row span b {
      color: #fff;
    }
    .dash-sub-row .elev-val {
      color: var(--green);
    }

    /* ── Bottom Controls Dock ─────────────────────────────────────── */
    .hud-controls {
      position: fixed;
      bottom: 16px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      flex: 1;
      height: 44px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn.active {
      background: var(--cyan);
      color: #0f172a;
      font-weight: 800;
      border-color: var(--cyan);
    }

    .ctrl-btn.rec-btn {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .ctrl-btn.rec-btn.recording {
      animation: pulse-rec 1s infinite;
    }
    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    /* ── Chibi 3D Runner Avatar with Drop Shadow ──────────────────── */
    .runner-marker {
      width: 48px;
      height: 48px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Ground Shadow on the road */
    .runner-shadow {
      position: absolute;
      bottom: 2px;
      width: 26px;
      height: 10px;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 50%;
      filter: blur(2px);
      transform: skewX(-20deg);
      z-index: 1;
    }

    /* Animated Chibi Character Body */
    .chibi-body {
      position: relative;
      z-index: 2;
      width: 34px;
      height: 38px;
      animation: chibi-run 0.55s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes chibi-run {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(3deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-4px) rotate(-3deg); }
    }

    .watermark-pill {
      position: fixed;
      bottom: 130px;
      right: 14px;
      z-index: 10;
      font-size: 0.65rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(15, 23, 42, 0.65);
      padding: 3px 8px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #gpx-file-input { display: none; }
  </style>
</head>
<body>

  <!-- MapLibre GL 3D Map Container -->
  <div id="map"></div>

  <!-- Top-Left Activity HUD -->
  <div class="hud-header">
    <div class="hud-tag">
      <div class="hud-tag-dot"></div>
      <span id="act-tag">LARI PAGI • PAGI</span>
    </div>
    <div class="hud-title" id="act-title">Run 2026 • #OM5126</div>
    <div class="hud-meta" id="act-meta">
      HAVEFANRUN • 27 Sep 2026 • 05.15 WIB<br>
      <span style="color:#64748b">Malang Raya, Jawa Timur (-7.978°, 112.635°)</span>
    </div>
  </div>

  <!-- Top-Right Mini GPS Minimap -->
  <div class="hud-minimap">
    <span class="minimap-lbl">GPS</span>
    <svg id="minimap-svg" viewBox="0 0 100 100">
      <polyline id="minimap-track" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle id="minimap-dot" r="5" fill="#10b981" stroke="#fff" stroke-width="2" />
    </svg>
  </div>

  <!-- Discreet Watermark -->
  <div class="watermark-pill">• jejaklari.id</div>

  <!-- Bottom Telemetry Dashboard -->
  <div class="hud-dashboard">
    <div class="dash-top">
      <div class="dash-dist">
        <span id="stat-dist">0.26</span>
        <span class="dash-dist-target">/ <span id="stat-target">5.03</span> KM</span>
      </div>
      <div class="dash-time" id="stat-time">01:42</div>
    </div>

    <div class="dash-progress-track">
      <div class="dash-progress-fill" id="stat-progress"></div>
    </div>

    <div class="dash-metrics-grid">
      <div class="metric-card">
        <div class="m-lbl">Pace (/km)</div>
        <div class="m-val pace" id="stat-pace">5'57"</div>
      </div>
      <div class="metric-card">
        <div class="m-lbl">Heart Rate</div>
        <div class="m-val hr" id="stat-hr">165 <span style="font-size:0.65rem">bpm</span></div>
      </div>
      <div class="metric-card">
        <div class="m-lbl">Cadence</div>
        <div class="m-val cadence" id="stat-cadence">189 <span style="font-size:0.65rem">spm</span></div>
      </div>
    </div>

    <div class="dash-sub-row">
      <span>DISTANCE: <b id="stat-sub-dist">0.26 km</b></span>
      <span>ELEV GAIN: <b class="elev-val" id="stat-sub-elev">+3 m</b></span>
      <span>TIME: <b id="stat-sub-time">01:42</b></span>
    </div>
  </div>

  <!-- Bottom Controls Dock -->
  <div class="hud-controls">
    <button class="ctrl-btn active" id="btn-play">⏸ Pause</button>
    <button class="ctrl-btn" id="btn-speed">⚡ 1x</button>
    <button class="ctrl-btn" id="btn-route">🔄 Malang 5K</button>
    <button class="ctrl-btn rec-btn" id="btn-record">🔴 Rekam</button>
    <button class="ctrl-btn" id="btn-upload">📂 GPX</button>
  </div>

  <input type="file" id="gpx-file-input" accept=".gpx,.fit,.xml" />

  <script>
    /* ── 1. Realistic Route Datasets ──────────────────────────────── */
    // Preset 1: Lapangan Rampal / Rindam V Brawijaya Malang 5K Loop (persis di screenshot!)
    function generateMalangLoop() {
      const center_lat = -7.9780, center_lon = 112.6350;
      const pts = [];
      const count = 90;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        const lat = center_lat + 0.0065 * (Math.sin(a) + 0.25 * Math.sin(3 * a));
        const lon = center_lon + 0.0075 * (Math.cos(a) + 0.15 * Math.cos(2 * a));
        const elev = 442 + Math.round(4 * Math.sin(a * 2));
        const paceSec = 350 + Math.round(15 * Math.sin(a * 4));
        const hr = 162 + Math.round(7 * Math.sin(a));
        const cad = 188 + Math.round(3 * Math.cos(a * 2));
        pts.push({
          lat, lon, ele: elev,
          pace: `${Math.floor(paceSec/60)}'${String(paceSec%60).padStart(2,'0')}"`,
          hr, cad
        });
      }
      return pts;
    }

    // Preset 2: Wandr Banyuwangi Trail (Ketapang -> De Djawatan -> Ijen)
    const banyuwangiTrail = [
      { lat: -8.1456, lon: 114.3975, ele: 12, pace: "5'40\"", hr: 155, cad: 182 },
      { lat: -8.2120, lon: 114.3680, ele: 35, pace: "5'30\"", hr: 160, cad: 185 },
      { lat: -8.2550, lon: 114.3450, ele: 85, pace: "5'45\"", hr: 165, cad: 188 },
      { lat: -8.3850, lon: 114.2800, ele: 60, pace: "5'25\"", hr: 168, cad: 190 },
      { lat: -8.4230, lon: 114.2050, ele: 48, pace: "5'50\"", hr: 163, cad: 186 },
      { lat: -8.1850, lon: 114.2850, ele: 420, pace: "6'40\"", hr: 175, cad: 178 },
      { lat: -8.0750, lon: 114.2420, ele: 1850, pace: "8'15\"", hr: 180, cad: 165 },
      { lat: -8.0580, lon: 114.2420, ele: 2386, pace: "8'50\"", hr: 182, cad: 160 }
    ];

    let currentTrack = generateMalangLoop();
    let isMalangPreset = true;

    // Interpolate high-density smooth points for buttery 60 FPS movement
    function getDensePath(waypoints, steps = 30) {
      const res = [];
      for (let i = 0; i < waypoints.length - 1; i++) {
        const p1 = waypoints[i];
        const p2 = waypoints[i + 1];
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          res.push({
            lat: p1.lat + (p2.lat - p1.lat) * t,
            lon: p1.lon + (p2.lon - p1.lon) * t,
            ele: p1.ele + (p2.ele - p1.ele) * t,
            pace: p1.pace,
            hr: Math.round(p1.hr + (p2.hr - p1.hr) * t),
            cad: Math.round(p1.cad + (p2.cad - p1.cad) * t)
          });
        }
      }
      res.push(waypoints[waypoints.length - 1]);
      return res;
    }

    let densePoints = getDensePath(currentTrack);

    function calcBearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    /* ── 2. Initialize Ultra-Lightweight Vector Map ────────────────── */
    // OpenFreeMap Liberty Vector Style (Sangat ringan di HP, 0 MB kuota satelit berat!)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [densePoints[0].lon, densePoints[0].lat],
      zoom: 16.8,
      pitch: 58, // 3D Isometric Tilt Angle
      bearing: 30,
      antialias: true
    });

    /* ── 3. Map Layers & Extrusion ─────────────────────────────────── */
    function setupRouteLayers() {
      const fullCoords = densePoints.map(p => [p.lon, p.lat]);

      if (map.getSource('track-full')) {
        map.getSource('track-full').setData({
          type: 'Feature', geometry: { type: 'LineString', coordinates: fullCoords }
        });
        map.getSource('track-travelled').setData({
          type: 'Feature', geometry: { type: 'LineString', coordinates: [fullCoords[0]] }
        });
        updateMinimap();
        return;
      }

      // Add 3D Extruded Buildings (Pastel Peach / Coral persis di screenshot!)
      try {
        if (!map.getLayer('3d-buildings')) {
          map.addLayer({
            'id': '3d-buildings',
            'source': 'openmaptiles',
            'source-layer': 'building',
            'type': 'fill-extrusion',
            'minzoom': 14,
            'paint': {
              'fill-extrusion-color': '#fce7e1', // Soft pastel peach
              'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 16, ['get', 'render_height']],
              'fill-extrusion-base': ['get', 'render_min_height'],
              'fill-extrusion-opacity': 0.88
            }
          });
        }
      } catch (e) {}

      // Add Route Line Sources
      map.addSource('track-full', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: fullCoords } }
      });

      map.addSource('track-travelled', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [fullCoords[0]] } }
      });

      // Background Soft Shadow
      map.addLayer({
        id: 'track-bg',
        type: 'line',
        source: 'track-full',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#cbd5e1',
          'line-width': 6,
          'line-opacity': 0.5
        }
      });

      // Glowing Blue Ribbon Path (Persis warna biru elektrik di screenshot!)
      map.addLayer({
        id: 'track-fg',
        type: 'line',
        source: 'track-travelled',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#0284c7', // Cyan / Electric Blue
          'line-width': 7,
          'line-opacity': 0.95
        }
      });

      updateMinimap();
    }

    /* ── 4. Chibi 3D Runner SVG Character ──────────────────────────── */
    let runnerMarker = null;

    function createRunnerAvatar() {
      const el = document.createElement('div');
      el.className = 'runner-marker';
      el.innerHTML = `
        <div class="runner-shadow"></div>
        <div class="chibi-body">
          <svg viewBox="0 0 64 74" width="100%" height="100%">
            <!-- Head & Cap (Black cap) -->
            <ellipse cx="32" cy="22" rx="14" ry="12" fill="#0f172a" />
            <path d="M 18 20 Q 32 10 46 20 Q 52 26 42 26 Z" fill="#1e293b" />
            <!-- Face -->
            <ellipse cx="32" cy="24" rx="11" ry="9" fill="#fed7aa" />
            <!-- Turquoise T-shirt -->
            <path d="M 22 34 L 42 34 L 39 52 L 25 52 Z" fill="#06b6d4" />
            <!-- Shorts -->
            <rect x="25" y="52" width="14" height="8" rx="2" fill="#0f172a" />
            <!-- Running Legs & White Shoes -->
            <rect x="26" y="60" width="4" height="10" fill="#fed7aa" />
            <rect x="34" y="60" width="4" height="10" fill="#fed7aa" />
            <ellipse cx="28" cy="71" rx="5" ry="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
            <ellipse cx="36" cy="71" rx="5" ry="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
          </svg>
        </div>
      `;
      return el;
    }

    map.on('load', () => {
      setupRouteLayers();

      const runnerEl = createRunnerAvatar();
      runnerMarker = new maplibregl.Marker({ element: runnerEl, rotationAlignment: 'map' })
        .setLngLat([densePoints[0].lon, densePoints[0].lat])
        .addTo(map);

      requestAnimationFrame(animationLoop);
    });

    /* ── 5. Mini GPS Overview SVG Renderer ─────────────────────────── */
    function updateMinimap() {
      const svg = document.getElementById('minimap-svg');
      const polyline = document.getElementById('minimap-track');

      const lats = densePoints.map(p => p.lat);
      const lons = densePoints.map(p => p.lon);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);

      const dLat = maxLat - minLat || 0.001;
      const dLon = maxLon - minLon || 0.001;

      const ptsStr = densePoints.filter((_, i) => i % 4 === 0).map(p => {
        const x = 12 + ((p.lon - minLon) / dLon) * 76;
        const y = 88 - ((p.lat - minLat) / dLat) * 76;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      polyline.setAttribute('points', ptsStr);
    }

    function setMinimapDot(curPt) {
      const lats = densePoints.map(p => p.lat);
      const lons = densePoints.map(p => p.lon);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);

      const x = 12 + ((curPt.lon - minLon) / (maxLon - minLon || 0.001)) * 76;
      const y = 88 - ((curPt.lat - minLat) / (maxLat - minLat || 0.001)) * 76;

      const dot = document.getElementById('minimap-dot');
      dot.setAttribute('cx', x.toFixed(1));
      dot.setAttribute('cy', y.toFixed(1));
    }

    /* ── 6. 60 FPS Animation & Telemetry Engine ───────────────────── */
    let curIdx = 0;
    let isPlaying = true;
    let speedMult = 1.0;
    let lastTime = performance.now();
    let totalTargetKm = 5.03;

    function animationLoop(now) {
      requestAnimationFrame(animationLoop);

      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (isPlaying && densePoints.length > 1) {
        const step = Math.max(1, Math.round(20 * speedMult * dt * 2.2));
        curIdx = (curIdx + step);

        if (curIdx >= densePoints.length - 1) {
          curIdx = 0;
        }

        const cur = densePoints[curIdx];
        const next = densePoints[Math.min(curIdx + 1, densePoints.length - 1)];

        // Update runner position
        runnerMarker.setLngLat([cur.lon, cur.lat]);

        // Compute Bearing to rotate camera along road curve
        const bearing = calcBearing(cur.lat, cur.lon, next.lat, next.lon);

        // Smooth Camera Follow
        map.jumpTo({
          center: [cur.lon, cur.lat],
          pitch: 58,
          bearing: bearing
        });

        // Update Blue Travelled Ribbon
        if (map.getSource('track-travelled')) {
          const travelled = densePoints.slice(0, curIdx + 1).map(p => [p.lon, p.lat]);
          map.getSource('track-travelled').setData({
            type: 'Feature', geometry: { type: 'LineString', coordinates: travelled }
          });
        }

        // Update Mini GPS Dot
        setMinimapDot(cur);

        // Update Garmin/Strava Telemetry
        const progress = curIdx / (densePoints.length - 1);
        const curKm = (progress * totalTargetKm).toFixed(2);
        const elapsedSec = Math.round(progress * 102); // 01:42
        const m = Math.floor(elapsedSec / 60);
        const s = elapsedSec % 60;
        const timeStr = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        document.getElementById('stat-dist').innerText = curKm;
        document.getElementById('stat-time').innerText = timeStr;
        document.getElementById('stat-progress').style.width = `${(progress * 100).toFixed(1)}%`;

        document.getElementById('stat-pace').innerText = cur.pace || "5'57\"";
        document.getElementById('stat-hr').innerHTML = `${cur.hr || 165} <span style="font-size:0.65rem">bpm</span>`;
        document.getElementById('stat-cadence').innerHTML = `${cur.cad || 189} <span style="font-size:0.65rem">spm</span>`;

        document.getElementById('stat-sub-dist').innerText = `${curKm} km`;
        document.getElementById('stat-sub-elev').innerText = `+${Math.round(cur.ele - densePoints[0].ele + 3)} m`;
        document.getElementById('stat-sub-time').innerText = timeStr;
      }
    }

    /* ── 7. Controls & Event Listeners ────────────────────────────── */
    const playBtn = document.getElementById('btn-play');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
      playBtn.classList.toggle('active', isPlaying);
    });

    const speedBtn = document.getElementById('btn-speed');
    const speeds = [1.0, 2.0, 4.0];
    let sIdx = 0;
    speedBtn.addEventListener('click', () => {
      sIdx = (sIdx + 1) % speeds.length;
      speedMult = speeds[sIdx];
      speedBtn.innerText = `⚡ ${speedMult}x`;
    });

    // Preset Switcher (Malang 5K vs Banyuwangi)
    const routeBtn = document.getElementById('btn-route');
    routeBtn.addEventListener('click', () => {
      isMalangPreset = !isMalangPreset;
      if (isMalangPreset) {
        currentTrack = generateMalangLoop();
        totalTargetKm = 5.03;
        routeBtn.innerText = "🔄 Malang 5K";
        document.getElementById('act-tag').innerText = "LARI PAGI • PAGI";
        document.getElementById('act-title').innerText = "Run 2026 • #OM5126";
        document.getElementById('act-meta').innerHTML = "HAVEFANRUN • 27 Sep 2026 • 05.15 WIB<br><span style='color:#64748b'>Malang Raya, Jawa Timur (-7.978°, 112.635°)</span>";
        document.getElementById('stat-target').innerText = "5.03";
      } else {
        currentTrack = banyuwangiTrail;
        totalTargetKm = 88.5;
        routeBtn.innerText = "🔄 Wandr BWI";
        document.getElementById('act-tag').innerText = "EXPEDITION • TRAIL";
        document.getElementById('act-title').innerText = "Wandr Banyuwangi 3H2M";
        document.getElementById('act-meta').innerHTML = "Banyuwangi Tour • 2026 • 04.44 WIB<br><span style='color:#64748b'>Stasiun Ketapang ➔ Kawah Ijen</span>";
        document.getElementById('stat-target').innerText = "88.5";
      }
      densePoints = getDensePath(currentTrack, isMalangPreset ? 30 : 60);
      curIdx = 0;
      setupRouteLayers();
    });

    // 9:16 Video Recording
    const recBtn = document.getElementById('btn-record');
    let recorder = null;
    let chunks = [];

    recBtn.addEventListener('click', () => {
      const mapCanvas = map.getCanvas();
      if (!recorder || recorder.state === 'inactive') {
        chunks = [];
        const stream = mapCanvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 9000000 });

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `jejaklari_${Date.now()}.webm`;
          a.click();
          recBtn.innerText = "🔴 Rekam";
          recBtn.classList.remove('recording');
        };

        recorder.start();
        recBtn.innerText = "⏹ Stop";
        recBtn.classList.add('recording');
      } else {
        recorder.stop();
      }
    });

    // Upload Custom GPX / FIT File
    const uploadBtn = document.getElementById('btn-upload');
    const fileInput = document.getElementById('gpx-file-input');
    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target.result;
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "application/xml");
        const trkpts = xml.querySelectorAll("trkpt");

        if (trkpts.length < 2) {
          alert("Berkas GPX tidak memiliki koordinat <trkpt> yang cukup!");
          return;
        }

        const pts = [];
        const step = Math.max(1, Math.floor(trkpts.length / 80));
        for (let i = 0; i < trkpts.length; i += step) {
          const node = trkpts[i];
          const lat = parseFloat(node.getAttribute("lat"));
          const lon = parseFloat(node.getAttribute("lon"));
          const eleNode = node.querySelector("ele");
          const ele = eleNode ? parseFloat(eleNode.textContent) : 20;
          pts.push({
            lat, lon, ele,
            pace: "5'45\"",
            hr: 165,
            cad: 188
          });
        }

        currentTrack = pts;
        totalTargetKm = (pts.length * 0.08).toFixed(2);
        densePoints = getDensePath(currentTrack, 30);
        curIdx = 0;

        document.getElementById('act-title').innerText = file.name.replace(/\.[^/.]+$/, "");
        document.getElementById('stat-target').innerText = totalTargetKm;

        setupRouteLayers();
        alert(`Berhasil memuat ${pts.length} titik GPS dari berkas GPX!`);
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
