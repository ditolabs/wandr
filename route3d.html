<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wandr Banyuwangi • Interactive Route & Itinerary Player</title>

  <!-- MapLibre GL JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    :root {
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.4);
      --cyan: #0284c7;
      --green: #10b981;
      --card-bg: rgba(15, 23, 42, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    /* ── App Layout (Desktop Split-View / Mobile Fullscreen) ──────── */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100dvh;
      position: relative;
    }

    /* ── Left Sidebar (Desktop Itinerary Data) ────────────────────── */
    #sidebar {
      width: 380px;
      height: 100%;
      background: #090d16;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    .sidebar-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .btn-close-sidebar {
      display: none;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .day-tabs {
      display: flex;
      padding: 8px 16px;
      gap: 6px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--amber);
      color: var(--amber);
    }

    .itinerary-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: text;
    }
    .itinerary-list::-webkit-scrollbar {
      width: 5px;
    }
    .itinerary-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    .itin-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .itin-card:hover, .itin-card.active {
      background: rgba(30, 41, 59, 0.95);
      border-color: var(--amber);
      transform: translateX(4px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .itin-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      background: var(--amber);
      border-radius: 0 4px 4px 0;
    }

    .itin-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .itin-time {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--amber);
      background: rgba(245, 158, 11, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .itin-badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .itin-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .itin-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .itin-extra {
      display: flex;
      gap: 12px;
      font-size: 0.68rem;
      color: #cbd5e1;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 6px;
    }

    /* ── Right Section: Map & Overlay HUDs ────────────────────────── */
    #map-wrapper {
      flex: 1;
      position: relative;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* ── Mobile Sidebar Toggle Button ─────────────────────────────── */
    .btn-toggle-sidebar {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* ── Top-Right Mini GPS Minimap ───────────────────────────────── */
    .hud-minimap {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 20;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      width: 84px;
      height: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .minimap-lbl {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.55rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    #minimap-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ── Milestone Arrival Modal Card ─────────────────────────────── */
    /* ── Milestone Arrival Floating Toast (Top Right, Compact, Not in Center) ── */
    .milestone-popup {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-25px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 18px;
      padding: 10px 14px;
      width: calc(100vw - 28px);
      max-width: 440px;
      z-index: 42;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--amber-glow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .milestone-popup.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .milestone-info {
      flex: 1;
      text-align: left;
      overflow: hidden;
    }

    .milestone-badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--amber);
      color: var(--amber);
      border-radius: 12px;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .milestone-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .milestone-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      gap: 8px;
    }

    .btn-resume {
      flex-shrink: 0;
      padding: 8px 14px;
      height: 38px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
      transition: transform 0.15s;
    }
    .btn-resume:active {
      transform: scale(0.95);
    }

    /* ── Bottom Telemetry Dashboard ───────────────────────────────── */
    .hud-dashboard {
      position: fixed;
      bottom: 80px;
      right: 14px;
      left: auto;
      width: calc(100vw - 28px);
      max-width: 390px;
      z-index: 40;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px 16px 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .dash-dist {
      font-size: 1.85rem;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .dash-dist-target {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--amber);
    }

    .dash-time {
      font-size: 1.2rem;
      font-weight: 800;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    .dash-progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .dash-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b);
      transition: width 0.1s linear;
    }

    .dash-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 12px;
      text-align: left;
    }

    .metric-card .m-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .metric-card .m-val {
      font-size: 1.05rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .m-val.amber { color: var(--amber); }
    .m-val.green { color: var(--green); }
    .m-val.cyan { color: #38bdf8; }

    .dash-sub-row {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      font-size: 0.82rem;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Bottom Controls Dock ─────────────────────────────────────── */
    .hud-controls {
      position: fixed;
      bottom: 16px;
      right: 14px;
      left: auto;
      width: calc(100vw - 28px);
      max-width: 390px;
      z-index: 40;
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      flex: 1;
      height: 50px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: transform 0.15s, background 0.2s;
    }
    .ctrl-btn:active { transform: scale(0.96); }
    .ctrl-btn.active {
      background: var(--amber);
      color: #0f172a;
      font-weight: 800;
      border-color: var(--amber);
    }

    .ctrl-btn.rec-btn {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .ctrl-btn.rec-btn.recording { animation: pulse-rec 1s infinite; }
    @keyframes pulse-rec { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }

    .ctrl-btn.gps-live.active {
      background: #10b981;
      border-color: #10b981;
      color: #0f172a;
    }

    /* ── Vehicle Marker ───────────────────────────────────────────── */
    .vehicle-marker {
      width: 44px;
      height: 68px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .pin-circle {
      width: 24px;
      height: 24px;
      background: #0f172a;
      border: 2px solid var(--amber);
      border-radius: 50%;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .pin-circle:hover {
      transform: scale(1.2);
      border-color: #fff;
    }

    /* ── Collapsible Sidebar (Desktop & Mobile) ─────────────── */
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 380px;
      max-width: 85vw;
      height: 100%;
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 15px 0 35px rgba(0,0,0,0.6);
    }
    #sidebar.open {
      transform: translateX(0);
    }

    .btn-toggle-sidebar {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 45;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 15px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }
    .btn-toggle-sidebar:active {
      transform: scale(0.95);
    }

    .btn-close-sidebar {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-close-sidebar:hover {
      background: rgba(255,255,255,0.2);
    }

    @media (min-width: 900px) {
      .hud-dashboard, .hud-controls {
        right: 20px;
        left: auto;
        max-width: 420px;
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Left Sidebar (Daftar Itinerary Lengkap) -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div>
          <h1>📍 Wandr Banyuwangi</h1>
          <p>Itinerary 3 Hari 2 Malam (15 Titik)</p>
        </div>
        <button class="btn-close-sidebar" id="btn-close-side">✕</button>
      </div>

      <div class="day-tabs">
        <button class="tab-btn active" data-day="all">Semua</button>
        <button class="tab-btn" data-day="1">Hari 1</button>
        <button class="tab-btn" data-day="2">Hari 2</button>
        <button class="tab-btn" data-day="3">Hari 3</button>
      </div>

      <div class="itinerary-list" id="itinerary-items-container">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- Map Canvas & HUD Overlays -->
    <main id="map-wrapper">
      <div id="map"></div>

      <!-- Mobile Sidebar Toggle -->
      <button class="btn-toggle-sidebar" id="btn-open-side">
        📋 Daftar Itinerary
      </button>

      <!-- Top Right Mini GPS Minimap -->
      <div class="hud-minimap">
        <span class="minimap-lbl">GPS RADAR</span>
        <svg id="minimap-svg" viewBox="0 0 100 100">
          <polyline id="minimap-track" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <circle id="minimap-dot" r="5" fill="#f59e0b" stroke="#fff" stroke-width="2" />
        </svg>
      </div>

      <!-- Milestone Arrival Toast (Compact Top Banner) -->
      <div class="milestone-popup" id="milestone-modal">
        <div class="milestone-info">
          <span class="milestone-badge" id="m-badge">TIBA DI DESTINASI #1</span>
          <div class="milestone-title" id="m-title">Stasiun Ketapang</div>
          <div class="milestone-sub">
            <span id="m-time">⏰ 04:44 WIB</span>
            <span id="m-cost">🎟️ Gratis</span>
            <span id="m-ele">🏔️ 12 m</span>
          </div>
        </div>
        <button class="btn-resume" id="btn-continue-trip">Lanjut ▶</button>
      </div>

      <!-- Bottom Telemetry Dashboard -->
      <div class="hud-dashboard">
        <div class="dash-top">
          <div class="dash-dist">
            <span id="stat-dist">0.0</span>
            <span class="dash-dist-target">/ 226.8 KM</span>
          </div>
          <div class="dash-time" id="stat-time">04:44 WIB</div>
        </div>

        <div class="dash-progress-track">
          <div class="dash-progress-fill" id="stat-progress"></div>
        </div>

        <div class="dash-metrics-grid">
          <div class="metric-card">
            <div class="m-lbl">Kendaraan</div>
            <div class="m-val amber" id="stat-vehicle">🚙 Jeep 4x4</div>
          </div>
          <div class="metric-card">
            <div class="m-lbl">Elevasi</div>
            <div class="m-val green" id="stat-ele">12 m dpl</div>
          </div>
          <div class="metric-card">
            <div class="m-lbl">Progress Tour</div>
            <div class="m-val cyan" id="stat-stop">Stop 1/15</div>
          </div>
        </div>

        <div class="dash-sub-row" id="stat-next-dest">
          MENUJU: <b>Sego Cawuk Kalimas (06:00 WIB)</b>
        </div>
      </div>

      <!-- Bottom Controls Dock -->
      <div class="hud-controls">
        <button class="ctrl-btn active" id="btn-play">⏸ Pause</button>
        <button class="ctrl-btn" id="btn-speed">⚡ 1x</button>
        <button class="ctrl-btn gps-live" id="btn-gps-live">📍 GPS HP</button>
        <button class="ctrl-btn rec-btn" id="btn-record">🔴 Rekam</button>
      </div>
    </main>
  </div>

  <script>

        type: 'line',
        source: 'road-full',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#94a3b8',
          'line-width': 6,
          'line-opacity': 0.6
        }
      });

      // Travelled Glowing Path (Amber Gold khas Wandr)
      map.addLayer({
        id: 'road-fg',
        type: 'line',
        source: 'road-travelled',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#f59e0b',
          'line-width': 7,
          'line-opacity': 0.95
        }
      });

      // Add Interactive Waypoint Pins
      waypoints.forEach((wp, idx) => {
        const el = document.createElement('div');
        el.className = 'pin-circle';
        el.innerText = `${idx + 1}`;
        el.title = wp.name;
        el.addEventListener('click', () => jumpToWaypoint(idx));

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([wp.lon, wp.lat])
          .addTo(map);

        landmarkMarkers.push(marker);
      });

      updateMinimap();
    }

    /* ── 4. Safari Jeep 4x4 SVG Marker ────────────────────────────── */
    let vehicleMarker = null;

    function getJeepSVG() {
      return `
        <svg viewBox="0 0 40 70" width="36" height="62" style="filter: drop-shadow(0 6px 8px rgba(0,0,0,0.45));">
          <!-- Headlights beam on asphalt -->
          <polygon points="12,14 4,0 36,0 28,14" fill="rgba(254, 240, 138, 0.35)" />
          <!-- Wheels -->
          <rect x="3" y="14" width="5" height="12" rx="2" fill="#0f172a" />
          <rect x="32" y="14" width="5" height="12" rx="2" fill="#0f172a" />
          <rect x="3" y="44" width="5" height="12" rx="2" fill="#0f172a" />
          <rect x="32" y="44" width="5" height="12" rx="2" fill="#0f172a" />
          <!-- Jeep Body (Amber Gold) -->
          <rect x="7" y="12" width="26" height="48" rx="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
          <!-- Windshield -->
          <rect x="10" y="24" width="20" height="9" rx="2" fill="#0f172a" />
          <!-- Roof Rack & Travel Luggage -->
          <rect x="11" y="37" width="18" height="16" rx="3" fill="#b45309" stroke="#fed7aa" stroke-width="1.5" />
          <!-- Headlights -->
          <circle cx="11" cy="13" r="2.5" fill="#fef08a" />
          <circle cx="29" cy="13" r="2.5" fill="#fef08a" />
        </svg>
      `;
    }

    map.on('load', () => {
      setupRouteLayers();

      const el = document.createElement('div');
      el.className = 'vehicle-marker';
      el.innerHTML = getJeepSVG();

      vehicleMarker = new maplibregl.Marker({ element: el, rotationAlignment: 'map' })
        .setLngLat(roadPoints[0])
        .addTo(map);

      requestAnimationFrame(renderLoop);
    });

    /* ── 5. Render Sidebar Itinerary Items ─────────────────────────── */
    const itinContainer = document.getElementById('itinerary-items-container');

    function renderSidebarItems(filterDay = "all") {
      itinContainer.innerHTML = "";
      waypoints.forEach((wp, idx) => {
        if (filterDay !== "all" && wp.day !== parseInt(filterDay)) return;

        const card = document.createElement('div');
        card.className = `itin-card ${idx === 0 ? 'active' : ''}`;
        card.id = `card-wp-${idx}`;
        card.innerHTML = `
          <div class="itin-top-meta">
            <span class="itin-time">${wp.time} WIB</span>
            <span class="itin-badge">${wp.cat} • Hari ${wp.day}</span>
          </div>
          <div class="itin-title">${idx + 1}. ${wp.name}</div>
          <div class="itin-desc">${wp.desc}</div>
          <div class="itin-extra">
            <span>🎟️ ${wp.cost}</span>
            <span>🏔️ ${wp.ele} m dpl</span>
          </div>
        `;

        card.addEventListener('click', () => {
          jumpToWaypoint(idx);
          if (window.innerWidth < 900) {
            document.getElementById('sidebar').classList.remove('open');
          }
        });

        itinContainer.appendChild(card);
      });
    }
    renderSidebarItems();

    // Day Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderSidebarItems(btn.dataset.day);
      });
    });

    // Mobile Sidebar Toggle
    document.getElementById('btn-open-side').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('open');
    });
    document.getElementById('btn-close-side').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
    });

    /* ── 6. Milestone Modal Arrival Logic ──────────────────────────── */
    let isMilestonePaused = false;
    let visitedWaypoints = new Set();

    function triggerMilestone(wpIdx) {
      isMilestonePaused = true;
      const wp = waypoints[wpIdx];

      document.getElementById('m-badge').innerText = `TIBA DI DESTINASI #${wpIdx + 1} (${wp.time} WIB)`;
      document.getElementById('m-title').innerText = wp.name;
      document.getElementById('m-time').innerText = `⏰ ${wp.time} WIB`;
      document.getElementById('m-cost').innerText = `🎟️ ${wp.cost}`;
      document.getElementById('m-ele').innerText = `🏔️ ${wp.ele} m`;

      document.getElementById('milestone-modal').classList.add('active');

      // Update active card in sidebar
      document.querySelectorAll('.itin-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-wp-${wpIdx}`);
      if (activeCard) activeCard.classList.add('active');
    }

    function resumeTrip() {
      document.getElementById('milestone-modal').classList.remove('active');
      isMilestonePaused = false;
      isPlaying = true;
      document.getElementById('btn-play').innerText = "⏸ Pause";
      document.getElementById('btn-play').classList.add('active');
    }
    document.getElementById('btn-continue-trip').addEventListener('click', resumeTrip);

    function jumpToWaypoint(wpIdx) {
      const wp = waypoints[wpIdx];

      // Jika klik nomor 1 (Stasiun Ketapang / Awal), reset total dari awal tanpa melompat liar
      if (wpIdx === 0) {
        curRoadFloat = 0.0;
        visitedWaypoints.clear();
        isMilestonePaused = false;
        isPlaying = true;
        document.getElementById('milestone-modal').classList.remove('active');
        document.getElementById('btn-play').innerText = "⏸ Pause";
        document.getElementById('btn-play').classList.add('active');

        map.flyTo({
          center: [wp.lon, wp.lat],
          zoom: 15.2,
          speed: 1.2
        });

        // Reset jejak
        if (map.getSource('road-travelled')) {
          map.getSource('road-travelled').setData({
            type: 'Feature', geometry: { type: 'LineString', coordinates: [roadPoints[0]] }
          });
        }
        return;
      }

      // Jika klik destinasi lain: posisikan mobil di titik itu dan bersihkan waypoint berikutnya
      curRoadFloat = wp.road_index;
      visitedWaypoints = new Set(Array.from({length: wpIdx + 1}, (_, i) => i));

      map.flyTo({
        center: [wp.lon, wp.lat],
        zoom: 15.5,
        speed: 1.4
      });

      triggerMilestone(wpIdx);
    }

    /* ── 7. Mini GPS Radar ─────────────────────────────────────────── */
    function updateMinimap() {
      const polyline = document.getElementById('minimap-track');
      const lats = roadPoints.map(p => p[1]);
      const lons = roadPoints.map(p => p[0]);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);

      const dLat = maxLat - minLat || 0.001;
      const dLon = maxLon - minLon || 0.001;

      const ptsStr = roadPoints.filter((_, i) => i % 6 === 0).map(p => {
        const x = 12 + ((p[0] - minLon) / dLon) * 76;
        const y = 88 - ((p[1] - minLat) / dLat) * 76;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      polyline.setAttribute('points', ptsStr);
    }

    function setMinimapDot(curPt) {
      const lats = roadPoints.map(p => p[1]);
      const lons = roadPoints.map(p => p[0]);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLon = Math.min(...lons), maxLon = Math.max(...lons);

      const x = 12 + ((curPt[0] - minLon) / (maxLon - minLon || 0.001)) * 76;
      const y = 88 - ((curPt[1] - minLat) / (maxLat - minLat || 0.001)) * 76;

      const dot = document.getElementById('minimap-dot');
      dot.setAttribute('cx', x.toFixed(1));
      dot.setAttribute('cy', y.toFixed(1));
    }

    /* ── 8. Winding Road Animation Loop (Ultra-Smooth & Scenic Slow) ── */
    let curRoadFloat = 0.0; // Float index for silky sub-point gliding
    let isPlaying = true;
    let speedMult = 0.25; // Default: Sangat santai dan pelan (nikmati pemandangan)
    let lastTime = performance.now();
    const totalKm = 226.8;

    function interpolateCoord(c1, c2, t) {
      return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t];
    }

    function renderLoop(now) {
      requestAnimationFrame(renderLoop);

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isPlaying && !isMilestonePaused && roadPoints.length > 1) {
        // Kecepatan santai: ~2.5 - 4 titik per detik di speed 1x
        const advance = 14 * speedMult * dt;
        curRoadFloat += advance;

        if (curRoadFloat >= roadPoints.length - 1) {
          curRoadFloat = 0;
          visitedWaypoints.clear();
        }

        const baseIdx = Math.floor(curRoadFloat);
        const nextIdx = Math.min(baseIdx + 1, roadPoints.length - 1);
        const frac = curRoadFloat - baseIdx;

        const curPt = interpolateCoord(roadPoints[baseIdx], roadPoints[nextIdx], frac);
        const lookAheadIdx = Math.min(baseIdx + 3, roadPoints.length - 1);
        const lookAheadPt = roadPoints[lookAheadIdx];

        // Posisi & rotasi mobil
        vehicleMarker.setLngLat(curPt);
        const bearing = calcBearing(curPt[1], curPt[0], lookAheadPt[1], lookAheadPt[0]);
        vehicleMarker.setRotation(bearing);

        // Kamera mengikuti mobil dengan halus
        map.jumpTo({
          center: curPt,
          pitch: 42,
          bearing: bearing
        });

        // Gambar jejak rute yang sudah dilewati
        if (map.getSource('road-travelled')) {
          const travelled = roadPoints.slice(0, baseIdx + 1);
          travelled.push(curPt);
          map.getSource('road-travelled').setData({
            type: 'Feature', geometry: { type: 'LineString', coordinates: travelled }
          });
        }

        setMinimapDot(curPt);

        // Cek ketibaan destinasi (hanya trigger sekali per waypoint)
        for (let i = 0; i < waypoints.length; i++) {
          const wp = waypoints[i];
          if (Math.abs(curRoadFloat - wp.road_index) <= 1.2 && !visitedWaypoints.has(i)) {
            visitedWaypoints.add(i);
            triggerMilestone(i);
            break;
          }
        }

        // Hitung telemetri
        const progress = curRoadFloat / (roadPoints.length - 1);
        const curKm = (progress * totalKm).toFixed(1);

        let activeWp = waypoints[0];
        let nextWp = waypoints[1];
        for (let i = 0; i < waypoints.length; i++) {
          if (curRoadFloat >= waypoints[i].road_index) {
            activeWp = waypoints[i];
            nextWp = waypoints[Math.min(i + 1, waypoints.length - 1)];
          }
        }

        document.getElementById('stat-dist').innerText = curKm;
        document.getElementById('stat-time').innerText = `${activeWp.time} WIB`;
        document.getElementById('stat-progress').style.width = `${(progress * 100).toFixed(1)}%`;
        document.getElementById('stat-ele').innerText = `${activeWp.ele} m dpl`;
        document.getElementById('stat-stop').innerText = `Stop ${activeWp.id}/${waypoints.length}`;
        document.getElementById('stat-next-dest').innerHTML = `MENUJU: <b>${nextWp.name} (${nextWp.time} WIB)</b>`;
      }
    }

    /* ── 9. Controls & Live Smartphone GPS Follow ─────────────────── */
    const playBtn = document.getElementById('btn-play');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
      playBtn.classList.toggle('active', isPlaying);
    });

    const speedBtn = document.getElementById('btn-speed');
    const speeds = [0.5, 1.0, 1.5, 2.0];
    let sIdx = 1;
    speedBtn.addEventListener('click', () => {
      sIdx = (sIdx + 1) % speeds.length;
      speedMult = speeds[sIdx] * 0.25;
      speedBtn.innerText = `⚡ ${speeds[sIdx]}x`;
    });

    // Live Smartphone GPS Follow Mode
    let isLiveGPS = false;
    let gpsWatchId = null;
    const gpsBtn = document.getElementById('btn-gps-live');

    gpsBtn.addEventListener('click', () => {
      if (!isLiveGPS) {
        if (!navigator.geolocation) {
          alert("Browser tidak mendukung geolokasi GPS!");
          return;
        }
        isPlaying = false;
        playBtn.innerText = "▶ Play";
        playBtn.classList.remove('active');

        gpsWatchId = navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          vehicleMarker.setLngLat([lon, lat]);
          map.flyTo({ center: [lon, lat], zoom: 16 });
        }, (err) => {
          alert(`Gagal membaca GPS HP: ${err.message}`);
          isLiveGPS = false;
          gpsBtn.classList.remove('active');
        }, { enableHighAccuracy: true });

        isLiveGPS = true;
        gpsBtn.classList.add('active');
        gpsBtn.innerText = "📍 GPS Aktif";
      } else {
        navigator.geolocation.clearWatch(gpsWatchId);
        isLiveGPS = false;
        gpsBtn.classList.remove('active');
        gpsBtn.innerText = "📍 GPS HP";
      }
    });

    // 9:16 Reels Video Recording
    const recBtn = document.getElementById('btn-record');
    let recorder = null;
    let chunks = [];

    recBtn.addEventListener('click', () => {
      const mapCanvas = map.getCanvas();
      if (!recorder || recorder.state === 'inactive') {
        chunks = [];
        const stream = mapCanvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 9000000 });

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `wandr_banyuwangi_road_${Date.now()}.webm`;
          a.click();
          recBtn.innerText = "🔴 Rekam";
          recBtn.classList.remove('recording');
        };

        recorder.start();
        recBtn.innerText = "⏹ Stop";
        recBtn.classList.add('recording');
      } else {
        recorder.stop();
      }
    });
  </script>
</body>
</html>
