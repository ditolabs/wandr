<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wandr 3D Map Route • Realistic GPS Travel & GPX Player</title>
  
  <!-- MapLibre GL JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    :root {
      --primary: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.4);
      --card-bg: rgba(15, 23, 42, 0.88);
      --border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
    }

    /* ── Top Telemetry HUD ────────────────────────────────────────── */
    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .telemetry-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    .dest-info h2 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dest-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stat-badge {
      text-align: right;
    }

    .stat-badge .val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .stat-badge .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, var(--primary));
      transition: width 0.1s linear;
    }

    /* ── Map Layer Switcher Floating Pill ─────────────────────────── */
    .map-switcher {
      position: fixed;
      top: 94px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .map-btn {
      padding: 6px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .map-btn.active {
      background: rgba(245, 158, 11, 0.2);
      color: var(--primary);
      border: 1px solid rgba(245, 158, 11, 0.5);
    }

    /* ── Floating Milestone Popup Card ────────────────────────────── */
    .milestone-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 20px;
      width: calc(100vw - 48px);
      max-width: 360px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px var(--primary-glow);
    }

    .milestone-popup.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .milestone-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .milestone-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .milestone-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .milestone-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
    }

    .milestone-stats .m-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .milestone-stats .m-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .btn-resume {
      width: 100%;
      height: 44px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }

    /* ── Bottom Controls Dock ─────────────────────────────────────── */
    .hud-bottom {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-dock {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .dock-btn {
      flex: 1;
      height: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dock-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.15);
    }

    .dock-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      font-weight: 800;
    }

    .dock-btn.record-btn {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .dock-btn.record-btn.recording {
      animation: pulse-red 1s infinite;
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.97); }
    }

    /* ── Custom Animated Vehicle Marker ───────────────────────────── */
    .vehicle-marker {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .vehicle-avatar-box {
      width: 38px;
      height: 38px;
      background: #f59e0b;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(245, 158, 11, 0.8);
      transition: transform 0.1s linear;
    }

    .vehicle-pulse {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.4);
      animation: ripple 1.5s infinite;
      z-index: -1;
    }

    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* ── Landmark Destination Markers ─────────────────────────────── */
    .landmark-pin {
      width: 28px;
      height: 28px;
      background: #1e293b;
      border: 2px solid #f59e0b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .landmark-pin.start {
      background: #10b981;
      border-color: #fff;
    }
    .landmark-pin.finish {
      background: #ef4444;
      border-color: #fff;
    }

    #gpx-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Real Geographic Map Container (MapLibre 3D) -->
  <div id="map"></div>

  <!-- Top Telemetry HUD -->
  <div class="hud-top">
    <div class="telemetry-card">
      <div class="dest-info">
        <h2 id="hud-dest-title">📍 Stasiun Ketapang</h2>
        <p id="hud-dest-sub">Hari 1 • Titik Kumpul & Mulai</p>
      </div>
      <div class="stat-badge">
        <div class="val" id="hud-dist-val">0.0 <span style="font-size:0.75rem">KM</span></div>
        <div class="lbl" id="hud-ele-val">12 m dpl</div>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="hud-progress"></div>
    </div>
  </div>

  <!-- Map Style Switcher (Satelit / Voyager / Dark) -->
  <div class="map-switcher">
    <button class="map-btn active" id="btn-style-sat">🛰️ Satelit</button>
    <button class="map-btn" id="btn-style-voy">🗺️ Jalan</button>
    <button class="map-btn" id="btn-style-dark">🌙 Malam</button>
  </div>

  <!-- Milestone Landmark Popup -->
  <div class="milestone-popup" id="milestone-modal">
    <span class="milestone-badge" id="m-badge">DESTINASI • HARI 1</span>
    <h3 class="milestone-title" id="m-title">Stasiun Ketapang</h3>
    <p class="milestone-desc" id="m-desc">Pintu gerbang kedatangan kereta api di Banyuwangi timur.</p>
    <div class="milestone-stats">
      <div>
        <div class="m-val" id="m-time">04:44</div>
        <div class="m-lbl">Tiba</div>
      </div>
      <div>
        <div class="m-val" id="m-dist">0.0 km</div>
        <div class="m-lbl">Jarak</div>
      </div>
      <div>
        <div class="m-val" id="m-ele">12 m</div>
        <div class="m-lbl">Elevasi</div>
      </div>
    </div>
    <button class="btn-resume" id="btn-continue-trip">Lanjut Perjalanan ▶</button>
  </div>

  <!-- Bottom Controls Dock -->
  <div class="hud-bottom">
    <div class="controls-dock">
      <button class="dock-btn active" id="btn-play-pause">⏸ Pause</button>
      <button class="dock-btn" id="btn-speed">⚡ 1x</button>
      <button class="dock-btn" id="btn-avatar">🚙 Jeep</button>
      <button class="dock-btn" id="btn-cam">📐 3D Tilt</button>
      <button class="dock-btn record-btn" id="btn-record">🔴 Rekam</button>
      <button class="dock-btn" id="btn-upload-gpx">📂 GPX</button>
    </div>
  </div>

  <input type="file" id="gpx-file-input" accept=".gpx,.xml" />

  <script>
    /* ── 1. Itinerary Coordinates (Banyuwangi Real Coordinates) ───── */
    const defaultRoute = [
      { name: "Stasiun Ketapang", lat: -8.1456, lon: 114.3975, ele: 12, time: "04:44", day: 1, desc: "Pintu gerbang kedatangan kereta api di Banyuwangi timur." },
      { name: "Sego Cawuk Kalimas", lat: -8.2120, lon: 114.3680, ele: 35, time: "06:00", day: 1, desc: "Sarapan kuliner khas Osing berkuah parutan kelapa pedas gurih." },
      { name: "Hutan De Djawatan", lat: -8.4230, lon: 114.2050, ele: 48, time: "08:00", day: 1, desc: "Hutan trembesi kanopi raksasa ala Lord of the Rings Benculuk." },
      { name: "Nasi Tempong Mak Ndut", lat: -8.3850, lon: 114.2800, ele: 60, time: "12:00", day: 1, desc: "Makan siang sambal tempong tomat ranti super pedas khas Rogojampi." },
      { name: "Srengenge Wetan Resto", lat: -8.2150, lon: 114.3650, ele: 40, time: "14:30", day: 1, desc: "Santai sore & ngopi di resto heritage pusat kota Banyuwangi." },
      { name: "Iglam Blue Fire Paltuding", lat: -8.0750, lon: 114.2420, ele: 1850, time: "17:30", day: 1, desc: "Check-in glamping sejuk di lereng pos pendakian Paltuding Ijen." },
      { name: "Kawah Ijen Blue Fire", lat: -8.0580, lon: 114.2420, ele: 2386, time: "01:30", day: 2, desc: "Trekking api biru abadi dan danau kawah asam toska terluas dunia." },
      { name: "Sendang Seruni & Batu Ampar", lat: -8.1850, lon: 114.2850, ele: 420, time: "10:30", day: 2, desc: "Mata air alami sejuk berlatar tebing rimbun di Tamansari." },
      { name: "Rujak Soto Mbok Mus", lat: -8.2550, lon: 114.3450, ele: 85, time: "13:00", day: 2, desc: "Kuliner legendaris perpaduan rujak petis kacang disiram kuah soto babat." },
      { name: "Pantai Grand Watudodol", lat: -8.1050, lon: 114.4120, ele: 5, time: "15:30", day: 2, desc: "Pantai panorama Selat Bali dengan deretan pohon kelapa dan batuan eksotis." },
      { name: "Avrila Cafe Tamansari", lat: -8.1950, lon: 114.2800, ele: 350, time: "19:00", day: 2, desc: "Makan malam santai kopi arabika Ijen dengan pemandangan pegunungan." },
      { name: "Desa Adat Kemiren", lat: -8.2050, lon: 114.3200, ele: 210, time: "07:30", day: 3, desc: "Kampung budaya suku Osing, sanggar kopi jaran goyang & rumah adat." },
      { name: "Rujak Soto Losari No. 39", lat: -8.2190, lon: 114.3680, ele: 25, time: "10:00", day: 3, desc: "Makan siang kuliner ikonik Losari sebelum pulang." },
      { name: "Pusat Oleh-Oleh Osing", lat: -8.2250, lon: 114.3600, ele: 30, time: "11:30", day: 3, desc: "Belanja kue bagiak kelapa, kopi osing, dan batik gajah oling." },
      { name: "Stasiun Ketapang (Drop-Off)", lat: -8.1456, lon: 114.3975, ele: 12, time: "14:00", day: 3, desc: "Selesai tour & boarding Kereta Api Blambangan Ekspres." }
    ];

    let currentWaypoints = [...defaultRoute];

    /* ── 2. Real Map Tile Definitions ─────────────────────────────── */
    const mapStyles = {
      satellite: {
        version: 8,
        sources: {
          'esri-sat': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Esri, Maxar, Earthstar'
          }
        },
        layers: [{ id: 'sat-layer', type: 'raster', source: 'esri-sat', minzoom: 0, maxzoom: 19 }]
      },
      voyager: {
        version: 8,
        sources: {
          'carto-voyager': {
            type: 'raster',
            tiles: ['https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap, © CARTO'
          }
        },
        layers: [{ id: 'voy-layer', type: 'raster', source: 'carto-voyager', minzoom: 0, maxzoom: 19 }]
      },
      dark: {
        version: 8,
        sources: {
          'carto-dark': {
            type: 'raster',
            tiles: ['https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}@2x.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap, © CARTO'
          }
        },
        layers: [{ id: 'dark-layer', type: 'raster', source: 'carto-dark', minzoom: 0, maxzoom: 19 }]
      }
    };

    /* ── 3. Initialize MapLibre 3D Perspective Map ────────────────── */
    const map = new maplibregl.Map({
      container: 'map',
      style: mapStyles.satellite,
      center: [114.3975, -8.1456],
      zoom: 13.5,
      pitch: 62,
      bearing: 200,
      antialias: true
    });

    function interpolateDenseRoute(waypoints, stepsPerLeg = 40) {
      const dense = [];
      for (let i = 0; i < waypoints.length - 1; i++) {
        const p1 = waypoints[i];
        const p2 = waypoints[i + 1];
        for (let s = 0; s < stepsPerLeg; s++) {
          const t = s / stepsPerLeg;
          const lat = p1.lat + (p2.lat - p1.lat) * t;
          const lon = p1.lon + (p2.lon - p1.lon) * t;
          const ele = p1.ele + (p2.ele - p1.ele) * t;
          dense.push({ lat, lon, ele, legIdx: i, tInLeg: t });
        }
      }
      dense.push({ ...waypoints[waypoints.length - 1], legIdx: waypoints.length - 2, tInLeg: 1 });
      return dense;
    }

    let denseRoute = interpolateDenseRoute(currentWaypoints);

    function getBearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    /* ── 4. Setup Map Layers & Route Lines ────────────────────────── */
    let landmarkMarkers = [];
    let vehicleMarker = null;
    let vehicleEl = null;

    function setupRouteLayers() {
      const fullCoords = denseRoute.map(p => [p.lon, p.lat]);

      if (map.getSource('route-full')) {
        map.getSource('route-full').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: fullCoords }
        });
        map.getSource('route-travelled').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: [fullCoords[0]] }
        });
        return;
      }

      map.addSource('route-full', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: fullCoords } }
      });

      map.addSource('route-travelled', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [fullCoords[0]] } }
      });

      map.addLayer({
        id: 'route-bg',
        type: 'line',
        source: 'route-full',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#ffffff',
          'line-width': 5,
          'line-opacity': 0.4
        }
      });

      map.addLayer({
        id: 'route-fg',
        type: 'line',
        source: 'route-travelled',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#f59e0b',
          'line-width': 6,
          'line-opacity': 0.95
        }
      });

      landmarkMarkers.forEach(m => m.remove());
      landmarkMarkers = [];

      currentWaypoints.forEach((wp, idx) => {
        const el = document.createElement('div');
        el.className = `landmark-pin ${idx === 0 ? 'start' : (idx === currentWaypoints.length - 1 ? 'finish' : '')}`;
        el.innerText = idx === 0 ? "🚩" : (idx === currentWaypoints.length - 1 ? "🏁" : `${idx + 1}`);

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([wp.lon, wp.lat])
          .addTo(map);

        landmarkMarkers.push(marker);
      });
    }

    map.on('load', () => {
      setupRouteLayers();

      vehicleEl = document.createElement('div');
      vehicleEl.className = 'vehicle-marker';
      vehicleEl.innerHTML = `
        <div class="vehicle-pulse"></div>
        <div class="vehicle-avatar-box" id="avatar-icon">🚙</div>
      `;

      vehicleMarker = new maplibregl.Marker({ element: vehicleEl, rotationAlignment: 'map' })
        .setLngLat([denseRoute[0].lon, denseRoute[0].lat])
        .addTo(map);

      requestAnimationFrame(renderLoop);
    });

    /* ── 5. Animation Engine & Telemetry ───────────────────────────── */
    let currentIndex = 0;
    let isPlaying = true;
    let speedMult = 1.0;
    let isTilt3D = true;
    let isMilestonePaused = false;
    let passedLegs = new Set();
    let currentAvatar = "🚙";

    function updateTelemetryHUD(idx) {
      const pt = denseRoute[idx];
      const progressRatio = idx / (denseRoute.length - 1);
      const totalKm = 88.5;
      const currentKm = (progressRatio * totalKm).toFixed(1);

      document.getElementById('hud-dist-val').innerHTML = `${currentKm} <span style="font-size:0.75rem">KM</span>`;
      document.getElementById('hud-progress').style.width = `${(progressRatio * 100).toFixed(1)}%`;
      document.getElementById('hud-ele-val').innerText = `${Math.round(pt.ele)} m dpl`;

      const currentWp = currentWaypoints[pt.legIdx] || currentWaypoints[0];
      document.getElementById('hud-dest-title').innerHTML = `📍 ${currentWp.name}`;
      document.getElementById('hud-dest-sub').innerText = `Hari ${currentWp.day || 1} • Pukul ${currentWp.time} WIB`;
    }

    function triggerMilestonePopup(wpIdx) {
      isMilestonePaused = true;
      const wp = currentWaypoints[wpIdx];
      document.getElementById('m-badge').innerText = `DESTINASI • HARI ${wp.day || 1}`;
      document.getElementById('m-title').innerText = wp.name;
      document.getElementById('m-desc').innerText = wp.desc;
      document.getElementById('m-time').innerText = wp.time;
      document.getElementById('m-dist').innerText = `${(wpIdx * 6.2).toFixed(1)} km`;
      document.getElementById('m-ele').innerText = `${wp.ele || 15} m`;

      document.getElementById('milestone-modal').classList.add('active');

      setTimeout(() => {
        resumeTrip();
      }, 3500);
    }

    function resumeTrip() {
      document.getElementById('milestone-modal').classList.remove('active');
      isMilestonePaused = false;
    }
    document.getElementById('btn-continue-trip').addEventListener('click', resumeTrip);

    let lastFrameTime = performance.now();

    function renderLoop(now) {
      requestAnimationFrame(renderLoop);

      const delta = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      if (isPlaying && !isMilestonePaused && denseRoute.length > 1) {
        const step = Math.max(1, Math.round(18 * speedMult * delta * 2.2));
        currentIndex = (currentIndex + step);

        if (currentIndex >= denseRoute.length - 1) {
          currentIndex = 0;
          passedLegs.clear();
        }

        const curPt = denseRoute[currentIndex];
        const nextPt = denseRoute[Math.min(currentIndex + 1, denseRoute.length - 1)];

        vehicleMarker.setLngLat([curPt.lon, curPt.lat]);

        const bearing = getBearing(curPt.lat, curPt.lon, nextPt.lat, nextPt.lon);

        map.jumpTo({
          center: [curPt.lon, curPt.lat],
          pitch: isTilt3D ? 65 : 10,
          bearing: isTilt3D ? bearing : 0
        });

        if (map.getSource('route-travelled')) {
          const travelledCoords = denseRoute.slice(0, currentIndex + 1).map(p => [p.lon, p.lat]);
          map.getSource('route-travelled').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: travelledCoords }
          });
        }

        if (curPt.tInLeg < 0.05 && !passedLegs.has(curPt.legIdx)) {
          passedLegs.add(curPt.legIdx);
          triggerMilestonePopup(curPt.legIdx);
        }

        updateTelemetryHUD(currentIndex);
      }
    }

    /* ── 6. UI Controls Interactivity ──────────────────────────────── */
    const playBtn = document.getElementById('btn-play-pause');
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
      playBtn.classList.toggle('active', isPlaying);
    });

    const speedBtn = document.getElementById('btn-speed');
    const speeds = [1.0, 2.0, 4.0];
    let sIdx = 0;
    speedBtn.addEventListener('click', () => {
      sIdx = (sIdx + 1) % speeds.length;
      speedMult = speeds[sIdx];
      speedBtn.innerText = `⚡ ${speedMult}x`;
    });

    const avatarBtn = document.getElementById('btn-avatar');
    const avatars = ["🚙", "🏃", "🚐", "🚂"];
    let aIdx = 0;
    avatarBtn.addEventListener('click', () => {
      aIdx = (aIdx + 1) % avatars.length;
      currentAvatar = avatars[aIdx];
      document.getElementById('avatar-icon').innerText = currentAvatar;
      avatarBtn.innerText = `${currentAvatar} Avatar`;
    });

    const camBtn = document.getElementById('btn-cam');
    camBtn.addEventListener('click', () => {
      isTilt3D = !isTilt3D;
      camBtn.innerText = isTilt3D ? "📐 3D Tilt" : "🗺️ 2D Flat";
      camBtn.classList.toggle('active', isTilt3D);
    });

    function switchMapStyle(styleKey, activeBtn) {
      document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
      map.setStyle(mapStyles[styleKey]);
      map.once('style.load', () => {
        setupRouteLayers();
      });
    }

    document.getElementById('btn-style-sat').addEventListener('click', (e) => switchMapStyle('satellite', e.target));
    document.getElementById('btn-style-voy').addEventListener('click', (e) => switchMapStyle('voyager', e.target));
    document.getElementById('btn-style-dark').addEventListener('click', (e) => switchMapStyle('dark', e.target));

    /* ── 7. Video Recording (9:16 Canvas Capture) ──────────────────── */
    const recBtn = document.getElementById('btn-record');
    let mediaRecorder = null;
    let recordedChunks = [];

    recBtn.addEventListener('click', () => {
      const mapCanvas = map.getCanvas();
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        recordedChunks = [];
        const stream = mapCanvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `wandr_gpx_map_${Date.now()}.webm`;
          a.click();
          recBtn.innerText = "🔴 Rekam";
          recBtn.classList.remove('recording');
        };

        mediaRecorder.start();
        recBtn.innerText = "⏹ Stop";
        recBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
      }
    });

    /* ── 8. Upload GPX File Parser ─────────────────────────────────── */
    const gpxBtn = document.getElementById('btn-upload-gpx');
    const gpxInput = document.getElementById('gpx-file-input');

    gpxBtn.addEventListener('click', () => gpxInput.click());

    gpxInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "application/xml");
        const trkpts = xml.querySelectorAll("trkpt");

        if (trkpts.length < 2) {
          alert("Berkas GPX tidak memiliki titik koordinat rute <trkpt> yang cukup!");
          return;
        }

        const parsedWaypoints = [];
        const step = Math.max(1, Math.floor(trkpts.length / 30));
        for (let i = 0; i < trkpts.length; i += step) {
          const pt = trkpts[i];
          const lat = parseFloat(pt.getAttribute("lat"));
          const lon = parseFloat(pt.getAttribute("lon"));
          const eleNode = pt.querySelector("ele");
          const ele = eleNode ? parseFloat(eleNode.textContent) : 20;
          parsedWaypoints.push({
            name: `Titik GPS #${parsedWaypoints.length + 1}`,
            lat, lon, ele,
            time: `Km ${(parsedWaypoints.length * 1.5).toFixed(1)}`,
            day: 1,
            desc: "Titik rute kustom dari unggahan berkas GPX pengguna."
          });
        }

        currentWaypoints = parsedWaypoints;
        denseRoute = interpolateDenseRoute(currentWaypoints);
        currentIndex = 0;
        passedLegs.clear();
        setupRouteLayers();
        alert(`Berhasil memuat rute GPX: ${parsedWaypoints.length} titik koordinat di peta nyata!`);
      };
      reader.readAsText(file);
    });
  </script>
</body>
