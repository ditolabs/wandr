<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wandr Video - TravelBoast Route Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .video-viewport {
      width: 100%;
      max-width: 380px;
      height: 675px; /* 9:16 ratio */
      background: #0f172a;
      border: 6px solid #1e293b;
      border-radius: 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
    }
    /* Top Reel Overlay */
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px 20px 40px;
      background: linear-gradient(180deg, rgba(9,13,22,0.9) 0%, rgba(9,13,22,0) 100%);
      z-index: 20;
      pointer-events: none;
    }
    .reel-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .trip-title {
      font-size: 1.25rem;
      font-weight: 900;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      letter-spacing: -0.5px;
    }
    /* Map Canvas Area */
    .map-stage {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 60% 40%, #1e293b 0%, #090d16 100%);
      overflow: hidden;
    }
    .map-grid-bg {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      transform: perspective(600px) rotateX(25deg);
      transform-origin: center center;
    }
    svg.route-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    /* Vehicle Token */
    .vehicle-marker {
      position: absolute;
      width: 44px;
      height: 44px;
      background: #f59e0b;
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.6);
      transform: translate(-50%, -50%);
      z-index: 15;
      transition: all 0.1s linear;
    }
    /* Destination Pop-up Card */
    .dest-card {
      position: absolute;
      bottom: 80px;
      left: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      padding: 16px;
      z-index: 25;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      transform: translateY(30px) scale(0.95);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dest-card.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .dest-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      background: #f59e0b;
      color: #78350f;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .dest-name {
      font-size: 1.05rem;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .dest-info {
      font-size: 0.78rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
    /* Bottom Controls */
    .bottom-bar {
      height: 70px;
      background: #090d16;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 30;
    }
    .play-btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .speed-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .timeline-progress {
      position: absolute;
      bottom: 0; left: 0; height: 4px;
      background: #f59e0b;
      width: 0%;
      z-index: 35;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="video-viewport">
    <div class="top-overlay">
      <div class="reel-tag">📍 TravelBoast Route Animation</div>
      <div class="trip-title">Banyuwangi 3H2M Solo Trip</div>
    </div>

    <div class="map-stage" id="mapStage">
      <div class="map-grid-bg"></div>
      
      <svg class="route-svg" viewBox="0 0 380 525">
        <defs>
          <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#10b981"/>
          </linearGradient>
        </defs>
        <!-- Background guide path -->
        <path id="guidePath" d="M 60,80 Q 220,120 300,200 T 100,340 T 280,450" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-linecap="round"/>
        <!-- Animated traced path -->
        <path id="activePath" d="M 60,80 Q 220,120 300,200 T 100,340 T 280,450" fill="none" stroke="url(#routeGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000"/>
        
        <!-- Waypoint pins -->
        <circle cx="60" cy="80" r="7" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
        <text x="75" y="85" fill="#e2e8f0" font-size="10" font-weight="800">01. Ketapang</text>

        <circle cx="300" cy="200" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
        <text x="210" y="205" fill="#e2e8f0" font-size="10" font-weight="800">03. De Djawatan</text>

        <circle cx="100" cy="340" r="7" fill="#10b981" stroke="#fff" stroke-width="2"/>
        <text x="115" y="345" fill="#e2e8f0" font-size="10" font-weight="800">07. Kawah Ijen</text>

        <circle cx="280" cy="450" r="7" fill="#ec4899" stroke="#fff" stroke-width="2"/>
        <text x="180" y="455" fill="#e2e8f0" font-size="10" font-weight="800">13. Desa Kemiren</text>
      </svg>

      <!-- Vehicle -->
      <div class="vehicle-marker" id="vehicle">🛵</div>

      <!-- Popup Destination Card -->
      <div class="dest-card" id="destCard">
        <span class="dest-badge" id="cardBadge">Hari 1 • 08:00 WIB</span>
        <div class="dest-name" id="cardName">Hutan De Djawatan Benculuk</div>
        <div class="dest-info">
          <span>🎟️ Tiket: Rp10.000</span>
          <span>🌳 Pesona Pohon Trembesi Lord of The Rings</span>
        </div>
      </div>
    </div>

    <div class="timeline-progress" id="timelineBar"></div>

    <div class="bottom-bar">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <div style="font-size:0.75rem; color:#94a3b8; font-weight:700;">Simulasi Rute 9:16</div>
      <button class="speed-btn" id="speedBtn" onclick="changeSpeed()">1x Speed</button>
    </div>
  </div>

  <div style="margin-top: 16px; display: flex; gap: 10px;">
    <a href="video.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: 700;">← Kembali ke Hub Video</a>
  </div>

  <script>
    const path = document.getElementById('guidePath');
    const activePath = document.getElementById('activePath');
    const vehicle = document.getElementById('vehicle');
    const card = document.getElementById('destCard');
    const playBtn = document.getElementById('playBtn');
    const speedBtn = document.getElementById('speedBtn');
    const timelineBar = document.getElementById('timelineBar');

    const pathLength = path.getTotalLength();
    activePath.style.strokeDasharray = pathLength;
    activePath.style.strokeDashoffset = pathLength;

    let progress = 0;
    let isPlaying = true;
    let speed = 1;
    let lastTime = null;

    const stops = [
      { p: 0.0, name: "Stasiun Ketapang", badge: "HARI 1 • 04:44 WIB", info: "Kedatangan KA Blambangan Ekspres" },
      { p: 0.35, name: "Hutan De Djawatan", badge: "HARI 1 • 08:00 WIB", info: "Tiket: Rp10.000 • Pohon Trembesi Raksasa" },
      { p: 0.68, name: "Trekking Kawah Ijen", badge: "HARI 2 • 01:30 WIB", info: "Tiket: Rp5.000 • Fenomena Blue Fire Dunia" },
      { p: 1.0, name: "Desa Adat Osing Kemiren", badge: "HARI 3 • 08:00 WIB", info: "Tiket: Rp15.000 • Tradisi Ngopi Sepiring Berdua" }
    ];

    function updateFrame(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (isPlaying) {
        progress += (delta * 0.12 * speed);
        if (progress > 1) progress = 0;

        const currentDist = progress * pathLength;
        activePath.style.strokeDashoffset = pathLength - currentDist;
        timelineBar.style.width = (progress * 100) + '%';

        const point = path.getPointAtLength(currentDist);
        vehicle.style.left = point.x + 'px';
        vehicle.style.top = point.y + 'px';

        // Check if near any stop
        let activeStop = null;
        for (const s of stops) {
          if (Math.abs(progress - s.p) < 0.08) {
            activeStop = s;
            break;
          }
        }

        if (activeStop) {
          document.getElementById('cardBadge').textContent = activeStop.badge;
          document.getElementById('cardName').textContent = activeStop.name;
          document.getElementById('cardInfo') ? document.getElementById('cardInfo').textContent = activeStop.info : null;
          card.classList.add('show');
        } else {
          card.classList.remove('show');
        }
      }

      requestAnimationFrame(updateFrame);
    }
    requestAnimationFrame(updateFrame);

    function togglePlay() {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
    }

    function changeSpeed() {
      speed = speed === 1 ? 2 : (speed === 2 ? 0.5 : 1);
      speedBtn.textContent = speed + 'x Speed';
    }
  </script>
</body>
</html>
